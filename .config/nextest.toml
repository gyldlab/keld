# cargo-nextest configuration.
# Install locally: cargo install cargo-nextest --locked
# Run: cargo nextest run --workspace --profile ci
#
# The `ci` profile is the verification gate AGENTS.md mandates, so it MUST NOT
# retry. A retry turns exactly the non-determinism the anti-flake rules exist to
# prevent into a green summary, and hides the first failure from the human or
# agent reading it — the same "papering over a failure" that AGENTS.md forbids
# everywhere else, applied to the gate that enforces it. A test that is not
# deterministic is fixed at the test (await the condition, bind port 0, use a
# temp dir), never absorbed here.
#
# The profile is kept (empty, inheriting `default`) because `--profile ci` is
# named by AGENTS.md, the `justfile`, and `.github/workflows/ci.yml`.
#
# `tools/ci_hygiene.rs` fails on a plainly-spelled `retries` in the sections
# measured to bind this gate: `[profile.ci]`, `[profile.default]` (which `ci`
# inherits, and where nextest's own docs put retries), either profile's
# `[[...overrides]]`, and either profile's `.retries` sub-table. That list is
# what has been measured, not a proof that nothing else binds. It is a speed
# bump, NOT enforcement of the rule above:
# nextest resolves retries from this file UNION `--retries` UNION
# `NEXTEST_RETRIES`, and flag and env win over the file, so a retrying gate can
# be produced without editing this file at all. Reading the config cannot decide
# the question. KEL-115 tracks proving it by behaviour instead — running the real
# gate command against a deliberately failing test and asserting one attempt.

[profile.ci]

# Per-test termination bound: a hung test is killed and reported as TIMEOUT after
# period x terminate-after = 10 minutes, instead of running until the 45-minute
# job timeout cancels the whole job with nothing naming the culprit (hosted macOS
# run 37252493645 hung in keld-core app_session::tests::host_echo_reply_shares_
# primary_reader_with_bun_call_and_ping for >2580s). This is a kill switch, NOT
# a retry: nextest does not rerun a terminated test, and the no-retry rule above
# is unchanged. Measured over the last 9 successful main ci.yml runs on all three
# hosted OSes (~13.6k PASS lines): slowest test 75.1s (macOS
# boot_admission::every_invalid_boot_class_fails_before_transient_window_listener_or_bun),
# then 57.2s (Windows keld-update transaction cut test) and 23.9s (Linux). 10 min
# is >= 8x the slowest, so measured durations need no per-test override; the one
# override (binary `no_flag_windows`, below) exists because a kill switch of its
# own is longer, not because a test ran slower. Re-measure before adding a slower
# test; never raise this to absorb a hang. The pinned
# taiki-e/install-action is SHA-pinned, and both native CI jobs explicitly
# select `nextest@0.9.149` with an executable-version assertion. Re-measure
# this bound whenever the reviewed Nextest binary pin changes.
slow-timeout = { period = "60s", terminate-after = 10 }

# Real macOS no-flag rows own native AppKit/WKWebView sessions. KEL-142 adds
# an OS-injected pointer acceptance row whose target must not be obscured or
# moved by another no-flag fixture while the click is in flight. The product
# does not require independent test processes to contend for one desktop.
# Preserve every assertion/deadline and serialize this native-GUI binary
# without retries, matching the existing Windows/Linux ownership rule.
[test-groups.macos-no-flag-gui]
max-threads = 1

[[profile.ci.overrides]]
filter = "binary(no_flag_macos)"
test-group = "macos-no-flag-gui"

# Real Windows no-flag rows each own a native WebView2 session. Running those
# sessions concurrently on the two-core GitHub runner can starve a renderer
# beacon while every process and port remains test-private. Serialize only this
# binary so the existing event-driven assertions and deadlines remain exact.
#
# This binary's per-test terminate is 12 min, not the 10 min above, because one
# of its own kill switches is longer than 10 min, so the default would cut a
# healthy test first. A host exit after `Quit` is bounded by keld-wv's
# `WEBVIEW2_TEARDOWN_BOUND`: the 325 s UI end, plus a post-release scavenge probe
# of a stale dev-ephemeral leaf (15 s launch + 325 s release). The harness adds
# its 20 s product deadline, and a handover cell adds the 10 s quit deadline D:
# 695 s in all. 12 min (720 s) is the smallest whole-minute bound above that, so
# no single kill switch is longer than the test's terminate. This bound does NOT
# cover a whole test whose sequential waits all run to their bounds (a startup
# then an exit, or two exits back to back): there a late switch can still end as
# nextest's anonymous TIMEOUT instead of its typed failure.
# `profiles::handover::kill_switches_stay_below_the_nextest_terminate`
# reads this block and fails if a kill switch reaches it.
[test-groups.windows-no-flag-gui]
max-threads = 1

[[profile.ci.overrides]]
filter = "binary(no_flag_windows)"
test-group = "windows-no-flag-gui"
slow-timeout = { period = "60s", terminate-after = 12 }

# Linux strict cases each construct user/mount/PID/network namespaces and use
# the same built launcher artifact. Parallel nextest processes can make
# Bubblewrap setup fail under shared runner limits; this is not a concurrency
# product contract. Preserve every assertion/deadline and serialize this one
# OS-bound binary without retries.
[test-groups.linux-strict-boundary]
max-threads = 1

[[profile.ci.overrides]]
filter = "binary(linux_strict_boundary)"
test-group = "linux-strict-boundary"

# KEL-185's temporary hosted-entrypoint probe must publish its validated,
# redacted identity record even when the diagnostic test passes. This is one
# named test only; the stock lifecycle acceptance rows keep default output.
[[profile.ci.overrides]]
filter = "binary(bun_echo) & test(created_template_entrypoint_identity_precedes_the_main_guard)"
success-output = "immediate"

# These rows each own a real Wayland/WebKitGTK app session plus a strict Bun
# process tree. The product does not require independent test processes to
# contend for one desktop compositor. Preserve every deadline and assertion,
# and serialize this native-GUI binary without retries.
[test-groups.linux-no-flag-gui]
max-threads = 1

[[profile.ci.overrides]]
filter = "binary(no_flag_linux)"
test-group = "linux-no-flag-gui"
