[package]
name = "keld-core"
description = "Keld host runtime, lifecycle, and app-session orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Test-owned metadata root and fault controls for signed KEL-135 fixtures.
profile-test-hooks = ["keld-wv/profile-test-hooks"]

[dependencies]
keld-ipc = { workspace = true }
keld-guard = { workspace = true }
keld-native = { workspace = true }
keld-runtime = { workspace = true }
keld-wv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# KEL-254 A3 T3 Part B: the one internal edge through which the boot owner consumes
# KEL-53's opaque `ActivePackageSelection` and `ExpectedAppIdentity`. It adds no new
# workspace crate, but it brings keld-update's already-pinned third-party closure
# (zstd/zstd-sys, ed25519-dalek, blake3, base64, semver, sha2 0.11 and their
# dependencies) into keld-core's and keld-host.exe's Windows build. Windows only,
# because installed-root boot is Windows-only; keld-update never depends on keld-core.
keld-update = { workspace = true }
windows-permissions = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
# #528 T5: the guarded router tests digest their permissions manifest on every
# OS. `sha2` is already in each OS's build graph (keld-guard, keld-ipc), and is
# a normal dependency only on macOS above.
sha2 = { workspace = true }
tempfile = { workspace = true }
# Enables only KEL-135 fault injection in the signed core test fixture; this
# feature is absent from the normal release dependency above.
keld-wv = { workspace = true, features = ["profile-test-hooks"] }
# Unit tests send PINGs on an unallocated channel id (#634: `ChannelId::for_test`).
keld-ipc = { workspace = true, features = ["test-channel-ids"] }

[lints]
workspace = true
