[package]
name = "keld-core"
description = "Keld host runtime, lifecycle, and app-session orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Test-owned metadata root and fault controls for signed KEL-135 fixtures.
profile-test-hooks = ["keld-wv/profile-test-hooks"]

[dependencies]
keld-ipc = { workspace = true }
keld-guard = { workspace = true }
keld-runtime = { workspace = true }
keld-wv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
sha2 = { workspace = true }
windows-permissions = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Enables only KEL-135 fault injection in the signed core test fixture; this
# feature is absent from the normal release dependency above.
keld-wv = { workspace = true, features = ["profile-test-hooks"] }

[lints]
workspace = true
