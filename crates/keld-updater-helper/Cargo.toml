[package]
name = "keld-updater-helper"
description = "The elevated Keld updater helper executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# KEL-53 §5: a binary-only crate that builds only keld-updater-helper.exe. Nothing
# depends on it. Its normal edges are Windows-only, so the non-Windows binary refuses
# without compiling them.
[[bin]]
name = "keld-updater-helper"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
keld-guard = { workspace = true }
keld-ipc = { workspace = true }
keld-update = { workspace = true }

[lints]
workspace = true
