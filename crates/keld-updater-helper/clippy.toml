# keld-updater-helper clippy configuration (KEL-53 §4 "Helper launch and self-anchor").
#
# Clippy reads only the first clippy.toml it finds, starting in this crate, so the root
# file's keys are restated here verbatim; tests/lint_config.rs fails when one is missing.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

# The elevated helper starts no Bun child, app role or shell (KEL-53 §4, criterion 17):
# every keld-runtime entry point that starts one is disallowed in this crate, and so is
# every std::process::Command method that starts a process directly. Only the test
# crates that run the built helper or cargo allow the std methods, each with a reason.
disallowed-methods = [
    { path = "std::process::Command::spawn", reason = "starts a process; the elevated helper starts no Bun, app role or shell (KEL-53 criterion 17)" },
    { path = "std::process::Command::output", reason = "starts a process; the elevated helper starts no Bun, app role or shell (KEL-53 criterion 17)" },
    { path = "std::process::Command::status", reason = "starts a process; the elevated helper starts no Bun, app role or shell (KEL-53 criterion 17)" },
    { path = "keld_runtime::Supervisor::start", reason = "starts a supervised Bun child; the elevated helper starts no Bun or app role (KEL-53 criterion 17)" },
    { path = "keld_runtime::Supervisor::start_with_stdout_markers", reason = "starts a supervised Bun child; the elevated helper starts no Bun or app role (KEL-53 criterion 17)" },
    { path = "keld_runtime::primary::PrimaryRoleSupervisor::start", reason = "starts an app role; the elevated helper starts no Bun or app role (KEL-53 criterion 17)" },
    { path = "keld_runtime::primary::PrimaryRoleSupervisor::start_with_bound_generations", reason = "starts an app role; the elevated helper starts no Bun or app role (KEL-53 criterion 17)" },
    { path = "keld_runtime::primary::PrimaryRoleSupervisor::start_with_bound_generations_gated", reason = "starts an app role; the elevated helper starts no Bun or app role (KEL-53 criterion 17)" },
    { path = "keld_runtime::windows_lpac::WindowsLpacProfile::spawn_suspended", reason = "starts an AppContainer app role; the elevated helper starts no Bun or app role (KEL-53 criterion 17)" },
    { path = "keld_runtime::windows_job::launch_elevated_updater_helper", reason = "a shell runas launch is the host's; the elevated helper starts no helper or shell (KEL-53 criterion 17)" },
]
