<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GH1037 relative assets</title>
  <style>
    html, body { background: #111; color: #eee; }
    #relative-probe { color: rgb(11, 22, 33); }
    #inline-control { color: rgb(19, 73, 109); }
  </style>
</head>
<body>
  <p id="relative-probe">Relative stylesheet observation</p>
  <p id="inline-control">Inline stylesheet control</p>
  <img alt="HTML parse calibration" src="http://127.0.0.1:__GH1037_PARSE_PORT__/GH1037_PARSE">
  <script>
    "use strict";
    // The sole load/error observer. Only it mints "pending", together with
    // both listeners; the same-helper controls prove those listeners fire.
    const state = {};
    function observe(element, key) {
      state[key] = "pending";
      element.addEventListener("load", () => { state[key] = "load"; }, { once: true });
      element.addEventListener("error", () => { state[key] = "error"; }, { once: true });
      return element;
    }
    const seen = (key) => state[key] ?? "UNOBSERVED";
    const sheet = observe(document.createElement("link"), "css");
    const relative = observe(document.createElement("img"), "image");
    const control = observe(document.createElement("img"), "control");
    const sheetControl = observe(document.createElement("link"), "sheetControl");
    function report(port, path) {
      const image = document.createElement("img");
      image.alt = path;
      image.src = "http://127.0.0.1:" + port + "/" + path;
      document.body.append(image);
    }
    const color = (id) => getComputedStyle(document.getElementById(id)).color.match(/\d+/g).join("-");
    function snapshot() {
      return [
        seen("css"), seen("image"), relative.naturalWidth, color("relative-probe"),
        seen("control"), control.naturalWidth, color("inline-control"),
        encodeURIComponent(document.baseURI),
        sheet.hasAttribute("href") ? "1" : "0",
        encodeURIComponent(sheet.getAttribute("href") ?? "UNASSIGNED"),
        encodeURIComponent(sheet.href),
        sheet.isConnected ? "1" : "0",
        encodeURIComponent(sheet.rel), sheet.localName,
        sheet.ownerDocument === document ? "1" : "0",
        relative.hasAttribute("src") ? "1" : "0",
        encodeURIComponent(relative.getAttribute("src") ?? "UNASSIGNED"),
        encodeURIComponent(relative.src),
        relative.isConnected ? "1" : "0",
        relative.localName, relative.ownerDocument === document ? "1" : "0",
        document.readyState, sheet.disabled ? "1" : "0",
        relative.complete ? "1" : "0", seen("sheetControl")
      ].join("/");
    }
    window.addEventListener("load", () => {
      report(__GH1037_LOAD_PORT__, "GH1037_ASSETS/" + snapshot());
    }, { once: true });
    window.addEventListener("error", (event) => {
      report(__GH1037_ERROR_PORT__, "GH1037_SCRIPT_ERROR/" + encodeURIComponent(event.message));
    }, { once: true });
    report(__GH1037_SCRIPT_PORT__, "GH1037_SCRIPT");
    sheet.rel = "stylesheet";
    sheet.href = "./relative.css";
    document.head.append(sheet);
    sheetControl.rel = "stylesheet";
    sheetControl.href = "data:text/css," + encodeURIComponent("#gh1037-unused {}");
    document.head.append(sheetControl);
    relative.src = "./relative.svg";
    document.body.append(relative);
    control.src = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="3" height="5"></svg>');
    document.body.append(control);
  </script>
</body>
</html>
