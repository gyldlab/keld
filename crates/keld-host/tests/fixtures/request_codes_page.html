<!doctype html><html><head><meta charset="utf-8"><title>KEL140 Public FS Acceptance</title>
<style>html,body{margin:0;width:100%;height:100%;background:#111;color:#eee}#resend{position:fixed;inset:0;width:100%;height:100%;border:0;background:#163;color:white;font:28px system-ui}</style>
</head><body><button id="resend">Resend</button>
<script>
"use strict";
// GH-1095 hosted page (promoted from the GH-1081 round-1 page). The observer
// drives every step through one long-poll; the only other trigger is a real
// OS click. The page never uses a timer for ordering.
const base = "http://127.0.0.1:__PORT__";
const steps = __STEPS__;
const reloadSteps = __RELOAD_STEPS__;
const nonce = () => Array.from(crypto.getRandomValues(new Uint32Array(4)),
  value => value.toString(16).padStart(8, "0")).join("");
const documentNonce = nonce();
const navigation = performance.getEntriesByType("navigation")[0];
const navigationType = navigation ? navigation.type : "unknown";
const requests = [];
const outcomes = [];
const terminals = [];
const invokeNonces = new Map();
const resultEnvelopes = new Map();
const terminalWaiters = new Map();
function captureTerminal(requestId) {
  if (!invokeNonces.has(requestId) || !resultEnvelopes.has(requestId)) return;
  const requestNonce = invokeNonces.get(requestId);
  const rows = resultEnvelopes.get(requestId);
  resultEnvelopes.delete(requestId);
  for (const value of rows) {
    terminals.push({ nonce: requestNonce, ok: value.ok, code: value.code ?? null, detail: value.detail ?? null });
  }
  const waiter = terminalWaiters.get(requestNonce);
  if (waiter) { terminalWaiters.delete(requestNonce); waiter(); }
}
function awaitPassiveTerminal(requestNonce) {
  if (terminals.some(terminal => terminal.nonce === requestNonce)) return Promise.resolve();
  return new Promise(resolve => { terminalWaiters.set(requestNonce, resolve); });
}
// Passive observation of the existing bridge relay; the page never posts one.
window.addEventListener("message", event => {
  if (event.source !== window) return;
  const value = event.data;
  if (value?.__keldRelay === "invoke-v1" && value.channel === 1 && Array.isArray(value.payload)) {
    const request = requests.find(request => {
      const bytes = encodeRequest(JSON.stringify({ label: request.label, nonce: request.nonce }), request.count);
      return bytes.length === value.payload.length && bytes.every((byte, index) => byte === value.payload[index]);
    });
    if (request) { invokeNonces.set(value.request, request.nonce); captureTerminal(value.request); }
  } else if (value?.__keldRelay === "result-v1") {
    const rows = resultEnvelopes.get(value.request) ?? [];
    rows.push({ ok: value.ok, code: value.code ?? null, detail: value.detail ?? null });
    resultEnvelopes.set(value.request, rows);
    captureTerminal(value.request);
  }
});
// Same bounded sample codec as public_fs_page.html (one-byte length and count).
function encodeRequest(message, count) {
  const bytes = new TextEncoder().encode(message);
  if (bytes.length >= 128 || count >= 128) throw new Error("bounded sample request encoding");
  return new Uint8Array([bytes.length, ...bytes, count]);
}
function decodeResponse(bytes, expectedCount) {
  let offset = 1;
  let length = bytes[0];
  if (length >= 128) {
    if (bytes.length < 3 || bytes[1] >= 128) throw new Error("sample response length encoding");
    length = (length & 127) | (bytes[1] << 7);
    offset = 2;
  }
  if (bytes.length > 4096 || bytes.length !== offset + length + 1 ||
      bytes[offset + length] !== expectedCount) throw new Error("sample response bounds/count");
  return JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes.slice(offset, offset + length)));
}
function state() {
  return { documentNonce, navigationType, requests, outcomes, terminals };
}
async function post(value) {
  const response = await fetch(base + "/observe", { method: "POST",
    headers: { "Content-Type": "text/plain" }, body: JSON.stringify(value) });
  if (!response.ok) throw new Error("gh1095 page observation refused");
}
async function report(phase, extra) {
  // Fence on the actual bridge result envelopes, never on a timer.
  await Promise.all(outcomes.map(outcome => awaitPassiveTerminal(outcome.nonce)));
  await post({ phase, ...state(), ...extra });
}
async function invoke(label) {
  const request = { label, nonce: nonce(), count: requests.length + 1 };
  requests.push(request);
  try {
    const payload = encodeRequest(JSON.stringify({ label, nonce: request.nonce }), request.count);
    const reply = decodeResponse(await window.keld.invoke(1, payload), request.count);
    outcomes.push({ label, nonce: request.nonce, ok: true, reply });
  } catch (error) {
    outcomes.push({ label, nonce: request.nonce, ok: false, name: error.name, error: error.message,
      code: error.code ?? null });
  }
}
// The app's own resend rule (spec gh1095 §4.4): one resend, as a new invoke,
// only after KELD-WV-012 (not dispatched) or KELD-API-002 (no app code ran),
// and only on a later user action; never a timer and never a second resend.
// Keld itself never resends.
const RESENDABLE = new Set(["KELD-WV-012", "KELD-API-002"]);
const pendingCalls = [];
let resendLabel = null;
let resent = false;
document.getElementById("resend").addEventListener("click", event => {
  const target = resendLabel;
  const previous = outcomes.find(outcome => outcome.label === target);
  if (!event.isTrusted || target === null || resent || !RESENDABLE.has(previous?.code)) {
    post({ phase: "click", trusted: event.isTrusted, resent: false, ...state() })
      .catch(error => post({ phase: "error", error: String(error) }));
    return;
  }
  resent = true;
  invoke(target + "-resend")
    .then(() => report("click", { trusted: event.isTrusted, resent: true }))
    .catch(error => post({ phase: "error", error: String(error) }));
});
async function run(script) {
  for (const step of script) {
    const command = await fetch(base + "/recovery-page");
    if (!command.ok) throw new Error("gh1095 page command refused");
    await command.text();
    if (step.do === "reload" || step.do === "navigate") {
      // The facade's own pagehide listener runs first and rejects a pending
      // call; its rejection is recorded before this listener reports it.
      window.addEventListener("pagehide", () => {
        navigator.sendBeacon(base + "/observe", JSON.stringify({ phase: "page-unload", ...state() }));
      }, { once: true });
      // A page-initiated main-frame navigation that commits a real successor
      // document served by the observer.
      if (step.do === "navigate") location.href = base + "/successor-page";
      else location.reload();
      return;
    }
    if (step.do === "invoke") await invoke(step.label);
    // Started, never awaited: the call stays pending while later steps run.
    if (step.do === "invoke-pending") pendingCalls.push(invoke(step.label));
    // Fence on the started calls' own settlement before reporting.
    if (step.do === "await-pending") await Promise.all(pendingCalls);
    if (step.do === "arm-resend") resendLabel = step.label;
    await report("step", { label: step.label, step: step.do });
  }
}
const script = navigationType === "reload" ? reloadSteps : steps;
report("page-ready", { bridge: typeof window.keld?.invoke === "function" })
  .then(() => run(script))
  .catch(error => post({ phase: "error", error: String(error) }));
</script></body></html>
