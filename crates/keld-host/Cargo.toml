[package]
name = "keld-host"
description = "The Keld shipping host executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "keld-host"
path = "src/main.rs"

[[bin]]
name = "keld-role-launcher"
path = "src/bin/keld-role-launcher.rs"

[dependencies]
keld-core = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
keld-runtime = { workspace = true }

[dev-dependencies]
keld-cli = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
windows-sys = { workspace = true }

[lints]
workspace = true
