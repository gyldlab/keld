[package]
name = "keld-pack"
description = "Canonical Windows v0 update package production for Keld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[target.'cfg(windows)'.dependencies]
# KEL-263: reuse the guard-owned native namespace validator and the existing
# workspace-pinned BLAKE3/zstd primitives. No new third-party version or feature;
# producer-only compression stays absent from non-Windows pack builds.
keld-guard = { workspace = true }
blake3 = { workspace = true }
zstd = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# KEL-19 container spec §5: the AC10 anonymous-file and failed-read tests and the
# real-host round trip. Already workspace-pinned and in Cargo.lock; no new crate.
tempfile = { workspace = true }

[lints]
workspace = true
