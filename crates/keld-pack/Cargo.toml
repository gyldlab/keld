[package]
name = "keld-pack"
description = "Canonical update packages and native macOS local application packaging for Keld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
# GH-1404: existing workspace pins only. SHA-256 binds captured inputs; tempfile
# owns unpublished staging; rustix supplies descriptor-relative no-follow opens
# and Apple's exclusive rename. Its existing safe event API bounds native-tool
# pipe polling without retaining blocked worker threads. No new crate/version.
# Serde emits external, non-authoritative receipts.
sha2 = { workspace = true }
tempfile = { workspace = true }
rustix = { workspace = true, features = ["event"] }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
# KEL-263: reuse the guard-owned native namespace validator and the existing
# workspace-pinned BLAKE3/zstd primitives. No new third-party version or feature;
# producer-only compression stays absent from non-Windows pack builds.
keld-guard = { workspace = true }
blake3 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
# KEL-19 container spec AC7: the synthetic writer output's SHA-256 equals one checked-in
# golden digest on every CI OS. Owner decision: Linear KEL-19 comment `dbddd923`.
# Rejected: hand-rolled SHA-256 (forbidden duplicate of a primitive), checked-in golden
# bytes (would change AC7's text), a blake3 dev-dependency (would change AC7 and §8).
# Workspace-pinned and already in Cargo.lock; no new crate.
sha2 = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# KEL-19 container spec §5: the AC10 anonymous-file and failed-read tests and the
# real-host round trip. Already workspace-pinned and in Cargo.lock; no new crate.
tempfile = { workspace = true }

[lints]
workspace = true
