[package]
name = "keld-ipc"
description = "kipc: Keld's typed, framed, capability-checked IPC plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Non-product: exposes only the `#[doc(hidden)]` raw-byte hook of the crate-private
# keld-attempt record codec to the separate fuzz workspace (crates/keld-ipc/fuzz), as
# keld-update's `fuzzing` feature does for its journal decoder (KEL-270 comment
# 136c2682). No product crate enables it.
fuzzing = []
# Non-product: `ChannelId::for_test`, the one constructor of an arbitrary channel id
# outside this crate (#634). Test targets enable it from `[dev-dependencies]`;
# keld-cli's channel_table_scan fails if any workspace manifest enables it for a
# production build (a normal or build dependency, a feature forward, a default).
test-channel-ids = []

[dependencies]
keld-guard = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(windows)'.dependencies]
# KEL-53 §4 "Candidate connect-back" *Locator* and §8 (approved: KEL-270 owner
# decision `eff8e2fb`): the keld-attempt endpoint locator hashes with the
# workspace-pinned BLAKE3 that keld-update and keld-pack already lock, so no new
# crate, version or feature enters Cargo.lock. Windows-only: only the Windows pipe
# namespace uses it, once per endpoint or claim, off the kipc hot path. Rejected: a
# digest in keld-update (splits the locator rule across two crates and makes the
# claimant's check before AA1 a caller callback), a keld-ipc -> keld-update edge
# (pulls the updater into every keld-ipc consumer) and a hand-written hash.
blake3 = { workspace = true }
windows-permissions = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_System_IO"] }

[dev-dependencies]
# Corpus digest only (KEL-133 spec §4: "The fixture's SHA-256 is printed by
# both test suites"). Reuses the workspace-pinned sha2 already used by
# keld-cli and keld-guard; dev-only, never on the hot path.
sha2 = { workspace = true }
# This crate's own integration tests and doctests forge unallocated ids (#634).
keld-ipc = { workspace = true, features = ["test-channel-ids"] }

[lints]
workspace = true
