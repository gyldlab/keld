[package]
name = "keld-wv"
description = "Keld's webview engine layer: WKWebView / WebView2 / WebKitGTK / pinned engines behind one trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Media-capture default-deny (KEL-59): evaluate `web.camera` / `web.microphone`
# on the live WKWebView permission callback. Sibling crate, not an upward edge.
keld-guard = { workspace = true }

[lints]
workspace = true

[target.'cfg(target_os="macos")'.dependencies]
tao = "0.35.3"
# `devtools` keeps `open_devtools`/`close_devtools` compiled in release builds
# so `WebEngine::devtools` is not debug-only (wry gates them behind
# `cfg(any(debug_assertions, feature = "devtools"))`).
#
# Dependency review (KEL-59 / AGENTS.md gate):
# Name: wry 0.56.1 (was 0.55.1)
# Purpose: `WebViewBuilder::with_permission_handler` — 0.55.1 auto-grants
#   camera/mic in `request_media_capture_permission` and has no handler API.
# Alternatives rejected: (a) stay on 0.55.1 and ship a Keld WKUIDelegate —
#   extra `unsafe` before the objc2 rewrite; (b) hardcoded Deny without
#   `keld-guard` — ticket requires capability wiring; (c) bump tao to 0.36 —
#   wry 0.56 `build` takes `HasWindowHandle`, so tao 0.35.3 still fits.
# Breaking: macOS/iOS `transparent`/`fullscreen` features removed (always on);
#   `protocol` feature removed (always on). Keld used neither flag.
# License: Apache-2.0 OR MIT (unchanged). MSRV 1.77 < Keld 1.93.
# Pin 0.56.1 not 0.56.0: macOS 11 debug_assertion skip for the media-capture
#   delegate method (wry #1781).
wry = { version = "0.56.1", features = ["devtools"] }

[target.'cfg(target_os="windows")'.dependencies]
tao = "0.35.3"
# Same wry version as macOS on purpose. 0.55.1 is the release whose
# `request_media_capture_permission` auto-grants with no handler API (KEL-59);
# pinning Windows to it would reintroduce on a new platform the exact default
# macOS just closed, and would make cargo build two wry copies. 0.56.1 keeps
# `webview2-com = "0.38"` / `windows = "0.61"`, so the probe deps below are
# unchanged by the bump.
wry = { version = "0.56.1", features = ["devtools"] }
# KEL-27 runtime probe. `GetAvailableCoreWebView2BrowserVersionString` is the
# API Microsoft documents for Evergreen detection; the registry layout it reads
# is an implementation detail that differs across runtime channels, so we do not
# read those keys ourselves. Same version wry pins, so cargo unifies.
webview2-com = "0.38"
# `CoTaskMemFree` releases the version string the probe allocates. wry already
# depends on `windows` 0.61 with `Win32_System_Com`, so this adds an explicit
# path to a crate already in the graph rather than a second copy.
windows = { version = "0.61", features = ["Win32_System_Com"] }
