[package]
name = "keld-wv"
description = "Keld webview engine abstraction and platform backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Explicit development fixture; absent from the shipping default build.
media-acceptance = []
# Internal deterministic fault fixtures for downstream KEL-135 test binaries.
# Release packages never enable this feature.
profile-test-hooks = ["dep:objc2-app-kit", "dep:block2", "objc2-foundation/NSNotification", "objc2-foundation/NSOperation", "objc2-foundation/block2"]
# A separate test-only root override for signed KEL-135 acceptance hosts.
# Release builds that enable it are rejected by the crate root.
profile-test-root = ["profile-test-hooks"]

[dependencies]
# Media-capture default-deny (KEL-59): evaluate `web.camera` / `web.microphone`
# on the live WKWebView permission callback. Sibling crate, not an upward edge.
keld-guard = { workspace = true }
# Common profile identity and schema-v1 durable records (KEL-135/T1). These
# reuse versions already present through `keld-guard`; no lockfile package is
# added. SHA-256 is the approved identity primitive, while serde's strict
# private documents keep marker/registry parsing under one policy owner.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

[target.'cfg(target_os="macos")'.dependencies]
tao = "0.35.3"
# KEL-135/T3 reuses Wry's `WKWebView` construction while the host owns one
# selected WKWebsiteDataStore and reads back its identifier/persistence before
# the first view. These are the exact objc2 versions already pinned by Wry.
objc2 = { workspace = true, features = ["exception", "disable-encoding-assertions"] }
objc2-foundation = { workspace = true, features = ["std", "objc2-core-foundation", "NSArray", "NSString", "NSPathUtilities", "NSProcessInfo", "NSUUID"] }
objc2-app-kit = { workspace = true, optional = true, features = ["NSWindow"] }
block2 = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, features = ["CFRunLoop", "CFDate"] }
objc2-web-kit = { workspace = true, features = ["std", "objc2-core-foundation", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
nix = { workspace = true, features = ["user"] }
getrandom = { workspace = true }
# `devtools` keeps `open_devtools`/`close_devtools` compiled in release builds
# so `WebEngine::devtools` is not debug-only (wry gates them behind
# `cfg(any(debug_assertions, feature = "devtools"))`).
#
# Dependency review (KEL-59 / AGENTS.md gate):
# Name: wry 0.56.1 (was 0.55.1)
# Purpose: `WebViewBuilder::with_permission_handler` — 0.55.1 auto-grants
#   camera/mic in `request_media_capture_permission` and has no handler API.
# Alternatives rejected: (a) stay on 0.55.1 and ship a Keld WKUIDelegate —
#   extra `unsafe` before the objc2 rewrite; (b) hardcoded Deny without
#   `keld-guard` — ticket requires capability wiring; (c) bump tao to 0.36 —
#   wry 0.56 `build` takes `HasWindowHandle`, so tao 0.35.3 still fits.
# Breaking: macOS/iOS `transparent`/`fullscreen` features removed (always on);
#   `protocol` feature removed (always on). Keld used neither flag.
# License: Apache-2.0 OR MIT (unchanged). MSRV 1.77 < Keld 1.97.
# Pin 0.56.1 not 0.56.0: macOS 11 debug_assertion skip for the media-capture
#   delegate method (wry #1781).
wry = { version = "0.56.1", features = ["devtools"] }

[target.'cfg(target_os="windows")'.dependencies]
tao = "0.35.3"
getrandom = { workspace = true }
windows-permissions = { workspace = true }
# --- Dependency review (KEL-65 / AGENTS.md gate) ---
# Name: webview2-com 0.38 (was probe-only; now the whole Windows backend)
# Purpose: direct WebView2 COM — environment/controller creation, the
#   PermissionRequested guard (KEL-59), navigation, and the runtime probe
#   (`GetAvailableCoreWebView2BrowserVersionString`, the API Microsoft
#   documents for Evergreen detection; the registry layout it reads differs
#   across runtime channels, so we do not read those keys ourselves).
# Alternatives rejected: (a) wry 0.56.1 — unconditionally injects its
#   `window.ipc` bridge through a blocking cross-process round-trip (96–109 ms
#   measured, KEL-65) and ships browser args that disable SmartScreen
#   (KEL-66); (b) hand-rolled COM vtables over `windows` alone — reimplements
#   what this crate exists to provide. Same version wry pinned, so the
#   macOS-side lockfile entry is unchanged.
webview2-com = "0.38"
# HWND/RECT/HRESULT constants (Win32_Foundation), atomic protected-DACL profile
# directory creation (Win32_Security/FileSystem), and CoInitializeEx/
# CoTaskMemFree (Win32_System_Com). Same crate+version webview2-com pins — an explicit path
# to a crate already in the graph rather than a second copy.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os="linux")'.dependencies]
tao = "0.35.3"
# --- Dependency review (KEL-28 / AGENTS.md gate) ---
# Name: wry 0.56.1 (same version/pin as macOS)
# Purpose: interim WebKitGTK backend — same "wry now, direct bindings later
#   only when wry is missing a hook" policy as macOS/Windows started with
#   (`docs/engineering/decisions.md` §2). `default = ["os-webview", "x11"]`
#   pulls in webkit2gtk 2.0.2 (v2_38) + gtk 0.18 (GTK3) + javascriptcore-rs +
#   soup3 — no linux-specific feature flags needed for the hello slice.
# Alternatives rejected: (a) direct webkit6/gtk4 bindings now — architecture
#   05 §1's destination, but skipping the wry-interim step here would be
#   inconsistent with how KEL-26/27 actually landed and would duplicate
#   wry's already-solved platform quirks for no reason (first-principles
#   test in root AGENTS.md); (b) a newer wry targeting GTK4/webkitgtk-6.0 —
#   0.56.1 does not offer one, and chasing it is out of scope for KEL-28.
# System deps (WSL Ubuntu 26.04, apt): libgtk-3-dev, libwebkit2gtk-4.1-dev,
#   libjavascriptcoregtk-4.1-dev, libsoup-3.0-dev, pkg-config, build-essential.
# License: Apache-2.0 OR MIT (unchanged from macOS's pin).
wry = { version = "0.56.1", features = ["devtools"] }
