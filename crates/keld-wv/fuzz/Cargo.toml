# KEL-142 raw-byte fuzz harness for the private keld.wv-link/v1 decoder.
#
# This is a separate cargo-fuzz workspace so the stable product workspace does
# not depend on the libFuzzer runtime. Any discovered failure must be minimized
# into crates/keld-wv/tests/wv_link.rs before the corpus is retained.
[package]
name = "keld-wv-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
keld-wv = { path = ".." }

[[bin]]
name = "wv_link"
path = "fuzz_targets/wv_link.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

# This cargo-fuzz harness is its own workspace, so it does not inherit the root
# KEL-201 crates.io patch. Mirror the exact reviewed GLib 0.18 backport used by
# the product workspace; KEL-253 remains the owner for removing this override.
[patch.crates-io]
glib = { git = "https://github.com/gyldlab/glib-0.18-backport", rev = "43ce77627b5d8fc2c4d63e644d2a2b13291c610f" }
