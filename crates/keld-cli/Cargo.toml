[package]
name = "keld-cli"
description = "Keld developer entrypoint and project-tooling orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "keld"
path = "src/main.rs"

[lib]
name = "keld_cli"
path = "src/lib.rs"

[dependencies]
keld-core = { workspace = true }
keld-ipc = { workspace = true }
keld-guard = { workspace = true }
keld-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
# MCP stdio server — see workspace Cargo.toml dependency review comment.
rmcp = { workspace = true }
tokio = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-permissions = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
