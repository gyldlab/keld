[package]
name = "keld-native"
description = "Keld guard-checked native service brokers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
fs-acceptance-observer = []

[dependencies]
cap-fs-ext = { workspace = true }
cap-std = { workspace = true }
keld-guard = { workspace = true }
keld-ipc = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_json.workspace = true

# GH1189 production dialogs use the exact Microsoft bindings already locked
# by the WebView2 backend (MIT OR Apache-2.0; MSRV 1.74). No new package
# version. Shell owns file selection; Controls owns TaskDialog; the existing
# STA supplies parent preflight and cancellation during the native modal call.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-authentication-services = { workspace = true, features = ["std", "ASFoundation", "ASWebAuthenticationSession", "ASWebAuthenticationSessionCallback", "block2"] }
# GH478 uses the already pinned typed AppKit package for a real retained
# NSAlert sheet, never dynamic selectors/another native framework or crate.
# The exact new feature set requires independent dependency/native review.
objc2-app-kit = { workspace = true, features = ["std", "NSWindow", "NSAlert", "NSButton", "NSCell", "NSControl", "NSResponder", "NSView", "NSApplication", "NSPanel", "NSOpenPanel", "NSSavePanel", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSEvent", "NSWorkspace", "objc2-uniform-type-identifiers", "block2"] }
# GH478 typed UTType allowedContentTypes, macOS 11+ dependency feature.
# Exact crate 0.3.2 is locked and must clear independent dependency/OS gates;
# do not use deprecated setAllowedFileTypes or a production unsafe selector.
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTType"] }
# KEL-89 token HTTP uses only existing exact workspace pins; independent edge/unsafe gates required.
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["std", "NSObject", "NSString", "NSData", "NSDate", "NSError", "NSDictionary", "NSValue", "NSURL", "NSURLRequest", "NSURLResponse", "NSURLSession", "NSOperation", "block2"] }
block2 = { workspace = true, features = ["std"] }
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Actual Foundation metadata fixtures reuse the existing workspace pin; test-only constructor feature.
objc2-foundation = { workspace = true, features = ["NSDictionary"] }

[lints]
workspace = true
