[package]
name = "keld-guard"
description = "Keld default-deny capability and strict-profile admission engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "keld-strict-probe"
path = "src/bin/keld-strict-probe.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# KEL-270 T4d S7 dependency gate: Win32_Security_Authentication_Identity is enabled
# here, not in the workspace pin, for logon_session.rs's LsaGetLogonSessionData and
# LsaFreeReturnBuffer. It adds no crate and leaves Cargo.lock unchanged.
windows-sys = { workspace = true, features = ["Win32_Globalization", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_System_SystemServices", "Win32_System_Threading"] }
windows-permissions = { workspace = true }

[lints]
workspace = true
