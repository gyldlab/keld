# Spec-named alias file (architecture 04 §2 / §3.1).
#
# Bun 1.3.14 does not apply `[alias]` to runtime `import "electron"` — it
# still resolves the npm `electron` package from `~/.bun/install/cache`.
# The working v0 resolver is `tsconfig.json` `compilerOptions.paths`
# (same mapping). Keep this file so `keld migrate` can write the
# spec-named config; do not treat `[alias]` as the oracle until Bun honors it.
[alias]
electron = "../src/index.ts"
