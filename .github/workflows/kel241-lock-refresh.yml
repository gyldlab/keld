name: KEL-241 lock refresh

on:
  push:
    branches:
      - agent/kel-241-refresh-compat-lock

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
      - name: Refresh and validate workspace lock metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null

          if ! git diff --quiet -- . ':(exclude)Cargo.lock'; then
            echo 'KEL-241: Cargo modified files other than Cargo.lock' >&2
            git status --short >&2
            exit 1
          fi

          expected=$'1\t0\tCargo.lock'
          actual="$(git diff --numstat -- Cargo.lock)"
          if [ "$actual" != "$expected" ]; then
            echo "KEL-241: expected exactly one added lockfile line, got: $actual" >&2
            git diff -- Cargo.lock >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          text = Path('Cargo.lock').read_text()
          marker = 'name = "keld-compat"\n'
          start = text.index(marker)
          next_package = text.index('\n[[package]]', start + len(marker))
          block = text[start:next_package]
          expected = {
              ' "keld-core",',
              ' "keld-ipc",',
              ' "serde",',
              ' "serde_json",',
              ' "sha2",',
          }
          deps = {line for line in block.splitlines() if line.startswith(' "')}
          if deps != expected:
              raise SystemExit(f'KEL-241: unexpected keld-compat dependency block: {sorted(deps)}')
          PY

          git diff --check
          git diff -- Cargo.lock

      - name: Commit generated lock repair and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/kel241-lock-refresh.yml
          git add Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): refresh keld-compat lock metadata'
          git push origin HEAD:agent/kel-241-refresh-compat-lock
