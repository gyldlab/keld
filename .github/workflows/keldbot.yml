# .github/workflows/keldbot.yml

name: KeldBot                    # Actions tab mein jo naam dikhega

on:                              # DOORBELL — kab jagana hai robot ko 🛎️
  # pull_request_target (not pull_request): fork PRs se bhi secrets milte hain, isliye external
  # contributors ke liye bhi checks kaam karte hain. Safe hai kyunki koi actions/checkout nahi
  # hai (PR ka code kabhi runner pe nahi aata) aur title/body sirf context.payload se JS data ke
  # taur pe padhte hain, kabhi shell/script text mein interpolate nahi hote — same pattern
  # jo oven-sh/bun apne comment-cop.yml/on-slop.yml mein use karta hai.
  pull_request_target:
    types: [opened, edited, synchronize]   # existing trusted PR metadata path
  merge_group:
    types: [checks_requested]
    branches: [main] # required gatekeeper/title-lint must exist on queue HEAD

concurrency:                     # ek PR pe do edits jaldi-jaldi ho toh purana run cancel, race/duplicate comment na ho
  group: keldbot-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

permissions: {}                  # DEFAULT-DENY. PR label/comment steps use ROBOKELD_TOKEN.
                                  # Merge-group metadata uses a job-scoped read-only GITHUB_TOKEN.

jobs:
  # One read-only identity owner for both required metadata checks. Resolve
  # merge_group via GitHub's authenticated queue API, not a guessed PR title,
  # event commit message, or PR-controlled expression in a script.
  queue-identity:
    name: KeldBot queue PR identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.resolve.outputs.number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve exact live singleton queue entry
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 pinned
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            if (owner !== 'gyldlab' || repo !== 'keld') {
              throw Error('KeldBot rejects another repository');
            }
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (!Number.isSafeInteger(pr?.number) || pr.number < 1 ||
                  !/^[a-f0-9]{40}$/.test(pr?.head?.sha || '')) {
                throw Error('KeldBot rejects malformed PR event');
              }
              core.setOutput('number', String(pr.number));
              core.setOutput('head_sha', pr.head.sha);
            } else if (context.eventName === 'merge_group') {
              const event = context.payload.merge_group;
              const sha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
              const ref = /^refs\/heads\/gh-readonly-queue\/main\/pr-([1-9][0-9]*)-[a-f0-9]{8,40}$/;
              const match = ref.exec(event?.head_ref || '');
              if (context.payload.action !== 'checks_requested' || !event ||
                  !match || event.base_ref !== 'refs/heads/main' ||
                  !sha(event.base_sha) || !sha(event.head_sha) ||
                  context.ref !== event.head_ref || context.sha !== event.head_sha) {
                throw Error('KeldBot refuses malformed merge-group provenance');
              }
              const number = Number(match[1]);
              if (!Number.isSafeInteger(number)) throw Error('Invalid queue PR number');
              const data = await github.graphql(`
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    mergeQueue(branch: "main") {
                      configuration { maximumEntriesToMerge }
                      entries(first: 100) {
                        totalCount
                        pageInfo { hasNextPage }
                        nodes {
                          headCommit { oid }
                          state
                          pullRequest {
                            number headRefOid baseRefName state isDraft
                          }
                        }
                      }
                    }
                  }
                }
              `, {owner, repo});
              const queue = data?.repository?.mergeQueue;
              const entries = queue?.entries;
              // GitHub GraphQL returns configuration:null for some real
              // queues. Enforce the one-PR merge limit when supplied; check
              // the exact staged tree below even if this config is absent.
              const maxEntries = queue?.configuration?.maximumEntriesToMerge;
              if ((queue?.configuration !== null &&
                   (!Number.isSafeInteger(maxEntries) || maxEntries < 1 || maxEntries > 1)) ||
                  !Number.isSafeInteger(entries?.totalCount) ||
                  entries.totalCount < 1 || entries.totalCount > 100 ||
                  entries?.pageInfo?.hasNextPage !== false ||
                  !Array.isArray(entries?.nodes) ||
                  entries.nodes.length !== entries.totalCount) {
                throw Error('KeldBot requires a complete queue and a one-PR merge limit');
              }
              const matches = entries.nodes.filter(e =>
                e?.pullRequest?.number === number);
              if (matches.length !== 1) {
                throw Error('KeldBot cannot identify exactly one live queue PR');
              }
              // The queue entry's headCommit is the STAGED group commit, not
              // the PR head. Prior queued PRs may already be included in its
              // history; merge limits alone do not restrict build content.
              // Bind stage SHA to this event and the live GitHub queue ref;
              // bind the PR head separately to pullRequest.headRefOid.
              const entry = matches[0];
              const queued = entry.pullRequest;
              const pr = (await github.rest.pulls.get({
                owner, repo, pull_number: number,
              })).data;
              const current = (await github.rest.git.getRef({
                owner, repo, ref: event.head_ref.replace(/^refs\//, ''),
              })).data;
              const groupCommit = (await github.rest.repos.getCommit({
                owner, repo, ref: event.head_sha,
              })).data;
              if (groupCommit?.sha !== event.head_sha ||
                  !Array.isArray(groupCommit.parents) ||
                  groupCommit.parents[0]?.sha !== event.base_sha) {
                throw Error('KeldBot refuses a group commit with the wrong base parent');
              }
              if (pr?.number !== number || pr.state !== 'open' || pr.draft ||
                  pr.base?.ref !== 'main' ||
                  pr.base?.repo?.full_name !== 'gyldlab/keld' ||
                  !sha(pr.base?.sha) || pr.base.sha !== event.base_sha ||
                  !sha(pr.head?.sha) || pr.head.sha !== queued.headRefOid ||
                  entry.headCommit?.oid !== event.head_sha ||
                  queued.baseRefName !== 'main' || queued.state !== 'OPEN' ||
                  queued.isDraft !== false ||
                  !['QUEUED','AWAITING_CHECKS','LOCKED','MERGEABLE'].includes(entry.state) ||
                  current?.object?.sha !== event.head_sha ||
                  !sha(pr.merge_commit_sha)) {
                throw Error('KeldBot refuses stale or retargeted queue PR');
              }
              // A one-PR merge limit does not ensure the staged group contains
              // only that PR: earlier queued changes can be stacked. Compare
              // the staged tree against the LIVE PR's standalone test merge.
              // A synthetic preview SHA may be regenerated, but its verified
              // immutable parent pair and tree must describe this exact PR.
              const preview = (await github.rest.repos.getCommit({
                owner, repo, ref: pr.merge_commit_sha,
              })).data;
              const previewTree = preview?.commit?.tree?.sha;
              if (preview?.sha !== pr.merge_commit_sha ||
                  !Array.isArray(preview.parents) || preview.parents.length !== 2 ||
                  preview.parents[0]?.sha !== pr.base.sha ||
                  preview.parents[1]?.sha !== pr.head.sha ||
                  !sha(previewTree) ||
                  groupCommit?.commit?.tree?.sha !== previewTree) {
                throw Error('KeldBot refuses a stacked group or stale PR preview tree');
              }
              core.setOutput('number', String(number));
              core.setOutput('head_sha', pr.head.sha);
            } else {
              throw Error('KeldBot refuses unknown event');
            }

  gatekeeper:                    # job ka internal naam

    # Always publish an actual required result. A failed identity job must
    # never turn a skipped required check into GitHub's green skip outcome.
    needs: queue-identity
    if: ${{ always() }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest       # GitHub ki free VM — Linux box
    steps:
      - name: Require authenticated queue identity
        env:
          KELD_QUEUE_RESULT: ${{ needs['queue-identity'].result }}
          KELD_QUEUE_NUMBER: ${{ needs['queue-identity'].outputs.number }}
          KELD_QUEUE_HEAD: ${{ needs['queue-identity'].outputs.head_sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 pinned
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.KELD_QUEUE_NUMBER);
            if (process.env.KELD_QUEUE_RESULT !== 'success' ||
                !/^[1-9][0-9]*$/.test(process.env.KELD_QUEUE_NUMBER || '') ||
                !Number.isSafeInteger(number) ||
                !/^[a-f0-9]{40}$/.test(process.env.KELD_QUEUE_HEAD || '')) {
              throw Error('KeldBot cannot admit a failed or missing queue identity');
            }
            if (context.eventName === 'pull_request_target' &&
                (number !== context.payload.pull_request?.number ||
                 process.env.KELD_QUEUE_HEAD !== context.payload.pull_request?.head?.sha)) {
              throw Error('KeldBot PR identity changed');
            }
            if (context.eventName === 'merge_group' &&
                context.sha !== context.payload.merge_group?.head_sha) {
              throw Error('KeldBot queue commit changed');
            }
      - name: Check PR template sections
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 -- pinned SHA, not mutable tag
        with:
          github-token: ${{ secrets.ROBOKELD_TOKEN }}   # keldrobo ke naam se comment/label post ho, github-actions[bot] se nahi
          script: |
            // Template ke saare required headings — .github/PULL_REQUEST_TEMPLATE.md se (source of truth).
            // Naya heading template mein add ho toh yahan bhi add karo, warna gatekeeper drift ho jaayega.
            const REQUIRED = ["Summary", "Spec refs", "Review gates", "Tests", "Platforms", "Perf impact"];
            const MARKER = "<!-- keldbot:template-check -->";
            const LABEL = "needs-template-fix";

            const body = context.payload.pull_request.body ?? "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            // Sirf heading ka naam dhoondna kaafi nahi — leftover template boilerplate (jaise
            // "<!-- 1–3 bullets -->") bhi "## Summary" ke saath aata hai aur khaali section ko pass kara dega.
            // Isliye har heading ke neeche ka actual content nikaalo, HTML comments strip karo, phir check karo.
            function sectionContent(heading) {
              const headingRe = new RegExp(`^##\\s+${heading}\\s*$`, "m");
              const match = headingRe.exec(body);
              if (!match) return null; // heading hi missing hai

              const afterHeading = body.slice(match.index + match[0].length);
              const nextHeadingIdx = afterHeading.search(/^##\s+/m);
              const raw = nextHeadingIdx === -1 ? afterHeading : afterHeading.slice(0, nextHeadingIdx);
              return raw.replace(/<!--[\s\S]*?-->/g, "").trim();
            }

            const missing = REQUIRED.filter((h) => {
              const content = sectionContent(h);
              return content === null || content.length === 0;
            });

            // Pichla bot comment dhoondo (agar hai) taaki har edit pe naya comment na banaye — update karo instead.
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(MARKER));

            if (missing.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });

              const commentBody =
                `${MARKER}\n👋 These sections are missing or empty in the PR description: **${missing.join(", ")}**\n\n` +
                `The template is here: .github/PULL_REQUEST_TEMPLATE.md — fill them in and save the description, and I'll re-check automatically.`;

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: commentBody });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: commentBody });
              }

              core.setFailed(`Missing/empty required PR template sections: ${missing.join(", ")}`);
              return;
            }

            // Sab sections complete hain — agar pehle label laga tha toh hata do, purana comment resolve kar do.
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL });
            } catch (err) {
              if (err.status !== 404) throw err; // label pehle se nahi tha, koi baat nahi
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: `${MARKER}\n✅ Template is complete now, thanks for fixing it!`,
              });
            }

            core.info("Template complete ✅");

      - name: Validate queued PR template (read-only)
        if: github.event_name == 'merge_group'
        env:
          KELD_QUEUE_NUMBER: ${{ needs['queue-identity'].outputs.number }}
          KELD_QUEUE_HEAD: ${{ needs['queue-identity'].outputs.head_sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 pinned
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo} = context.repo;
            const number = Number(process.env.KELD_QUEUE_NUMBER);
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            if (!Number.isSafeInteger(number) || pr?.number !== number ||
                pr.state !== 'open' || pr.draft ||
                pr.base?.ref !== 'main' || pr.base?.repo?.full_name !== 'gyldlab/keld' ||
                pr.head?.sha !== process.env.KELD_QUEUE_HEAD) {
              throw Error('KeldBot template recheck refuses changed PR');
            }
            const body = pr.body || '';
            const required = ['Summary','Spec refs','Review gates','Tests','Platforms','Perf impact'];
            const missing = required.filter(heading => {
              const match = new RegExp('^##\\s+' + heading + '\\s*$', 'm').exec(body);
              if (!match) return true;
              const remainder = body.slice(match.index + match[0].length);
              const end = remainder.search(/^##\s+/m);
              const raw = end < 0 ? remainder : remainder.slice(0,end);
              return !raw.replace(/<!--[\s\S]*?-->/g, '').trim();
            });
            if (missing.length) throw Error('Missing queued PR template sections: ' + missing.join(', '));
            core.info('Queued PR template complete');

  size-label:                    # doosra job — PR size (added+deleted lines) ke hisaab se label
    if: github.event_name == 'pull_request_target' && github.event.action != 'edited' # PR-only labels
    runs-on: ubuntu-latest
    steps:
      - name: Apply size/* label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 -- pinned SHA, not mutable tag
        with:
          github-token: ${{ secrets.ROBOKELD_TOKEN }}   # keldrobo ke naam se label post ho, github-actions[bot] se nahi
          script: |
            // Tiers ascending order mein — max = us tier ki upper-bound (inclusive) line count.
            // Naya tier add karna ho toh: label pehle GitHub pe banao, phir yahan array mein daalo.
            const SIZE_TIERS = [
              { name: "size/XS", max: 19 },
              { name: "size/S", max: 99 },
              { name: "size/M", max: 399 },
              { name: "size/L", max: 999 },
              { name: "size/XL", max: 1999 },
              { name: "size/2XL", max: 3999 },
              { name: "size/3XL", max: 7999 },
              { name: "size/4XL", max: Infinity },
            ];
            const ALL_SIZE_LABELS = SIZE_TIERS.map((t) => t.name);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            const changed = pr.additions + pr.deletions;
            const tier = SIZE_TIERS.find((t) => changed <= t.max); // XL ka max Infinity hai, hamesha koi na koi tier milega

            const currentLabels = pr.labels.map((l) => l.name);
            const stale = ALL_SIZE_LABELS.filter((n) => currentLabels.includes(n) && n !== tier.name);
            for (const name of stale) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (err) {
                if (err.status !== 404) throw err; // pehle se hata hua, koi baat nahi
              }
            }

            if (!currentLabels.includes(tier.name)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [tier.name] });
            }
            core.info(`${changed} lines changed -> ${tier.name}`);

  title-lint:                    # teesra job — PR title ko conventional-commit format se match karo

    # Always publish an actual required result. A failed identity job must
    # never turn a skipped required check into GitHub's green skip outcome.
    needs: queue-identity
    if: ${{ always() }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Require authenticated queue identity
        env:
          KELD_QUEUE_RESULT: ${{ needs['queue-identity'].result }}
          KELD_QUEUE_NUMBER: ${{ needs['queue-identity'].outputs.number }}
          KELD_QUEUE_HEAD: ${{ needs['queue-identity'].outputs.head_sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 pinned
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.KELD_QUEUE_NUMBER);
            if (process.env.KELD_QUEUE_RESULT !== 'success' ||
                !/^[1-9][0-9]*$/.test(process.env.KELD_QUEUE_NUMBER || '') ||
                !Number.isSafeInteger(number) ||
                !/^[a-f0-9]{40}$/.test(process.env.KELD_QUEUE_HEAD || '')) {
              throw Error('KeldBot cannot admit a failed or missing queue identity');
            }
            if (context.eventName === 'pull_request_target' &&
                (number !== context.payload.pull_request?.number ||
                 process.env.KELD_QUEUE_HEAD !== context.payload.pull_request?.head?.sha)) {
              throw Error('KeldBot PR identity changed');
            }
            if (context.eventName === 'merge_group' &&
                context.sha !== context.payload.merge_group?.head_sha) {
              throw Error('KeldBot queue commit changed');
            }
      - name: Check PR title format
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 -- pinned SHA, not mutable tag
        with:
          github-token: ${{ secrets.ROBOKELD_TOKEN }}   # keldrobo ke naam se comment/label post ho, github-actions[bot] se nahi
          script: |
            // Squash-merge PR title ko hi final commit message banata hai, isliye title yahan lint hota hai —
            // individual commits nahi. Types .agents/ci.md § KeldBot se (source of truth) — dono jagah साथ update karo.
            const TYPES = ["feat", "fix", "docs", "test", "chore", "ci", "style", "build"];
            const TITLE_RE = new RegExp(`^(${TYPES.join("|")})(\\([\\w./-]+\\))?!?: .+`);
            const MARKER = "<!-- keldbot:title-check -->";
            const LABEL = "needs-conventional-title";

            const title = context.payload.pull_request.title ?? "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(MARKER));
            const match = TITLE_RE.exec(title);

            if (!match) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });

              const commentBody =
                `${MARKER}\n👋 The PR title doesn't match the conventional-commit format: \`type(scope): subject\`\n\n` +
                `Allowed types: \`${TYPES.join("`, `")}\`. Example: \`feat(ipc): add shm channel\`. ` +
                `Edit the title and I'll re-check automatically (.agents/ci.md § KeldBot).`;

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: commentBody });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: commentBody });
              }

              core.setFailed(`PR title doesn't match type(scope): subject — got "${title}"`);
              return;
            }

            // Title valid hai — usse type nikaal ke matching type:* label lagao, purana stale type:* label hatao.
            const type = match[1];
            const typeLabel = `type:${type}`;
            const allTypeLabels = TYPES.map((t) => `type:${t}`);

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            const currentLabels = pr.labels.map((l) => l.name);

            const stale = allTypeLabels.filter((n) => currentLabels.includes(n) && n !== typeLabel);
            for (const name of stale) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            if (!currentLabels.includes(typeLabel)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [typeLabel] });
            }

            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL });
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: `${MARKER}\n✅ Title matches the conventional-commit format now, thanks!`,
              });
            }

            core.info(`Title OK -> ${typeLabel}`);
      - name: Validate queued PR title (read-only)
        if: github.event_name == 'merge_group'
        env:
          KELD_QUEUE_NUMBER: ${{ needs['queue-identity'].outputs.number }}
          KELD_QUEUE_HEAD: ${{ needs['queue-identity'].outputs.head_sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 pinned
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo} = context.repo;
            const number = Number(process.env.KELD_QUEUE_NUMBER);
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            if (!Number.isSafeInteger(number) || pr?.number !== number ||
                pr.state !== 'open' || pr.draft ||
                pr.base?.ref !== 'main' || pr.base?.repo?.full_name !== 'gyldlab/keld' ||
                pr.head?.sha !== process.env.KELD_QUEUE_HEAD) {
              throw Error('KeldBot title recheck refuses changed PR');
            }
            const types = ['feat','fix','docs','test','chore','ci','style','build'];
            const titleRe = new RegExp('^(' + types.join('|') + ')(\\([\\w./-]+\\))?!?: .+');
            if (!titleRe.test(pr.title || '')) throw Error('Queued PR title is not conventional');
            core.info('Queued PR title valid');
