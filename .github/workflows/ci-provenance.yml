# KEL-169: base-branch-owned CI admission, intentionally CodeQL-free.
# The verification job never executes PR code or accesses secrets. The separate
# publisher job uses a restricted environment-scoped GitHub App credential; no
# job checks out PR code, writes a cache, or runs a shell step.
name: CI provenance

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    name: CI provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified_head_sha: ${{ steps.verify.outputs.verified_head_sha }}
      verified_base_sha: ${{ steps.verify.outputs.verified_base_sha }}
    steps:
      - name: Refuse unreviewed CI authority changes
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0, pinned
        with:
          script: |
            // This script is sourced from protected default-branch bytes by
            // pull_request_target. PR contents are read only as untrusted API
            // metadata; never interpolate filenames into shell or run PR code.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const event = context.payload.pull_request;
            if (owner !== "gyldlab" || repo !== "keld" || !event) {
              throw new Error("CI provenance requires the expected base repository and PR event");
            }
            if (!Number.isSafeInteger(event.number) || event.number < 1) {
              throw new Error("CI provenance requires a valid pull request number");
            }
            const fetchPR = async () =>
              (await github.rest.pulls.get({ owner, repo, pull_number: event.number })).data;
            const verifyPR = (pr) => {
              if (!pr || pr.state !== "open" || pr.number !== event.number) {
                throw new Error("CI provenance refuses absent, closed or changed pull requests");
              }
              if (pr.base?.ref !== "main" || pr.base?.repo?.full_name !== "gyldlab/keld") {
                throw new Error("CI provenance accepts only gyldlab/keld main as the base");
              }
              if (pr.head?.sha !== event.head?.sha || pr.base?.sha !== event.base?.sha) {
                throw new Error("CI provenance refuses stale pull-request head/base event data");
              }
              // GitHub's immutable Compare Commits API exposes at most 300
              // changed files on its first page. Refuse the boundary itself
              // because 300 entries cannot prove that more were not truncated.
              if (!Number.isSafeInteger(pr.changed_files) ||
                  pr.changed_files < 0 || pr.changed_files >= 300) {
                throw new Error("CI provenance cannot safely enumerate all changed files");
              }
              return pr;
            };
            const before = verifyPR(await fetchPR());
            // PR-number listFiles is mutable, allowing an A -> B -> A ABA
            // force-push to hide a protected file in the middle of enumeration.
            // Compare the event's immutable base and head commit SHAs instead.
            // Only the first page of the comparison includes a file list.
            const comparison = (await github.rest.repos.compareCommits({
              owner, repo, base: before.base.sha, head: before.head.sha,
              page: 1, per_page: 100,
            })).data;
            const files = comparison?.files;
            if (comparison?.base_commit?.sha !== before.base.sha) {
              throw new Error("CI provenance refuses a comparison for the wrong immutable base");
            }
            if (!Array.isArray(files) || files.length !== before.changed_files ||
                files.length >= 300) {
              throw new Error("CI provenance refuses an incomplete or truncated file list");
            }
            // The PR itself can mint the old 'CI required' status. Until a
            // trusted job is made required, it must not be allowed to change
            // workflow definitions, the router, or executable CI policy.
            const protectedPath = (path) => {
              if (typeof path !== "string" || !path || path.includes("\\") ||
                  path.includes("\u0000")) {
                throw new Error("CI provenance refuses malformed Git paths");
              }
              const p = path.toLowerCase();
              const basename = p.slice(p.lastIndexOf("/") + 1);
              // Bun's native formatter can hide tracked sources via ignores
              // or change accepted formatting through per-directory configs.
              // These inputs are CI authority even when no workflow changes.
              const formatterPolicy =
                basename === ".gitignore" ||
                basename === ".prettierignore" ||
                basename === ".editorconfig" ||
                basename === ".prettierrc" ||
                basename.startsWith(".prettierrc.") ||
                basename.startsWith("prettier.config.") ||
                basename === ".oxfmtrc" ||
                basename.startsWith(".oxfmtrc.") ||
                basename.startsWith("oxfmt.config.") ||
                basename === "biome.json" ||
                basename === "biome.jsonc" ||
                basename === "package.yaml" ||
                basename === "package.yml";
              // Strict first rollout: scripts and config files executed by
              // CI are also authority, not merely the workflow YAML itself.
              // Require a separate trusted-base review for their changes.
              // Root workspace metadata and formatter/test configs can also
              // suppress required test discovery without changing ci.yml.
              return formatterPolicy ||
                p === "cargo.toml" || p.endsWith("/cargo.toml") ||
                p === "package.json" || p.endsWith("/package.json") ||
                p === "packages/@keld/kipc/scripts/echo-codegen.ts" ||
                // Directly executed native CI validation/harness sources. A
                // candidate must not replace a smoke/registry gate with echo 0.
                // Protect direct and transitive WebView test harness inputs;
                // e.g. linux_gui_smoke.sh -> linux_media_guard.sh ->
                // linux_media_checkout.sh, plus C interposers and Windows ps1.
                (p.startsWith("crates/keld-wv/tests/") &&
                  [".sh", ".ps1", ".c", ".bat", ".cmd"].some((ext) => p.endsWith(ext))) ||
                p === "crates/keld-wv/examples/linux_media_guard.rs" ||
                p === "docs/audits/verify.py" ||
                p === "docs/audits/test_verify.py" ||
                p === "bunfig.toml" || p.endsWith("/bunfig.toml") ||
                p === "rustfmt.toml" || p.endsWith("/rustfmt.toml") ||
                p === ".rustfmt.toml" || p.endsWith("/.rustfmt.toml") ||
                p === "tsconfig.json" || p.endsWith("/tsconfig.json") ||
                p.startsWith(".github/") ||
                p === ".ci-reader-proofs" || p.startsWith(".ci-reader-proofs/") ||
                p.startsWith(".cargo/") ||
                p.startsWith(".config/") ||
                p.startsWith("tools/") ||
                p === "justfile" ||
                p === "rust-toolchain.toml" ||
                p === "deny.toml" ||
                p.endsWith("/deny.toml") ||
                p.startsWith(".gitleaks") ||
                p === "clippy.toml" || p.endsWith("/clippy.toml") ||
                p === ".clippy.toml" || p.endsWith("/.clippy.toml");
            };
            const protectedChanges = [];
            for (const file of files) {
              if (!file || !["added", "removed", "modified", "renamed", "changed", "copied"].includes(file.status)) {
                throw new Error("CI provenance refuses unknown changed-file status");
              }
              if (file.status === "renamed" && !file.previous_filename) {
                throw new Error("CI provenance refuses a rename with missing source path");
              }
              if (protectedPath(file.filename) ||
                  (file.previous_filename && protectedPath(file.previous_filename))) {
                protectedChanges.push(file.filename);
              }
            }
            // Reject every protected authority change until a separate,
            // revocation-aware maintainer approval protocol is live. GitHub
            // review dismissal does not trigger this pull_request_target job,
            // so caching a past APPROVED review would permit stale PASS.
            if (protectedChanges.length) {
              throw new Error("CI provenance: changes to protected CI authority require a separately reviewed trusted-base policy update: " +
                protectedChanges.slice(0, 12).join(", "));
            }
            verifyPR(await fetchPR()); // A new head must trigger its own event.
            core.info("CI provenance: unchanged workflow/router/CI authority; " +
              files.length + " PR files inspected at " + before.head.sha);
            core.setOutput("verified_head_sha", before.head.sha);
            core.setOutput("verified_base_sha", before.base.sha);

  publish:
    name: KELD VeriSentry publisher
    # A failure must publish FAIL on the exact current PR head, not a skipped
    # GitHub Actions job. The required check itself is App-authenticated.
    needs: provenance
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: verisentry-publisher
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Mint repository-scoped VeriSentry installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # pinned v3, 2026-10-31
        with:
          app-id: "5550363"
          private-key: ${{ secrets.VERISENTRY_APP_PRIVATE_KEY }}
          owner: gyldlab
          repositories: keld
          # Narrow the installation token; the App installation has more access.
          permission-checks: write
          permission-pull-requests: read
      - name: Publish fail-closed exact-head VeriSentry check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned v9.0.0
        env:
          VERISENTRY_ADMISSION_RESULT: ${{ needs.provenance.result }}
          VERISENTRY_VERIFIED_HEAD: ${{ needs.provenance.outputs.verified_head_sha }}
          VERISENTRY_VERIFIED_BASE: ${{ needs.provenance.outputs.verified_base_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // Runs only from protected default-branch bytes. Never execute
            // untrusted code or interpolate PR data into a shell command.
            const { owner, repo } = context.repo;
            const event = context.payload.pull_request;
            const isSha = (value) => typeof value === "string" && /^[a-f0-9]{40}$/.test(value);
            if (owner !== "gyldlab" || repo !== "keld" || !event ||
                !Number.isSafeInteger(event.number) || event.number < 1 ||
                !isSha(event.head?.sha) || !isSha(event.base?.sha)) {
              throw new Error("VeriSentry refuses an untrusted PR event");
            }
            // GitHub computes the test-merge SHA asynchronously. Retry only
            // bounded GitHub API reads, never execute or fetch PR code.
            // Reject a moved/closed PR on EVERY read (including after delay).
            let pr;
            let ready = false;
            for (let attempt = 0; attempt < 6; attempt++) {
              pr = (await github.rest.pulls.get({
                owner, repo, pull_number: event.number,
              })).data;
              if (pr?.state !== "open" || pr?.number !== event.number ||
                  pr.base?.ref !== "main" ||
                  pr.base?.repo?.full_name !== "gyldlab/keld" ||
                  pr.head?.sha !== event.head.sha || pr.base?.sha !== event.base.sha) {
                throw new Error("VeriSentry refuses stale or changed PR state");
              }
              if (pr.mergeable === false) {
                throw new Error("VeriSentry refuses an unmergeable PR");
              }
              // Checks on the synthetic merge commit cannot be replayed by a
              // different PR that uses the same source head SHA.
              if (pr.mergeable === true && isSha(pr.merge_commit_sha)) {
                ready = true;
                break;
              }
              if (attempt < 5) {
                await new Promise((resolve) => setTimeout(resolve, 500 * (attempt + 1)));
              }
            }
            if (!ready) {
              throw new Error("VeriSentry requires a current test-merge commit");
            }
            const verified = process.env.VERISENTRY_ADMISSION_RESULT === "success" &&
              process.env.VERISENTRY_VERIFIED_HEAD === event.head.sha &&
              process.env.VERISENTRY_VERIFIED_BASE === event.base.sha;
            const details = `${process.env.GITHUB_SERVER_URL || "https://github.com"}/gyldlab/keld/actions/runs/${process.env.GITHUB_RUN_ID}`;
            // Update the App's existing canonical check instead of creating a
            // new same-name check for every PR title edit/synchronize. This
            // prevents a malicious edit flood from exhausting GitHub's 1000
            // same-name check-run limit and starving trusted maintenance.
            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: pr.merge_commit_sha,
              check_name: "KELD VeriSentry", app_id: 5550363,
              filter: "all", per_page: 100,
            });
            if (!Array.isArray(checks) || checks.length > 1000 ||
                checks.some(check => check.app?.id !== 5550363 ||
                  !Number.isSafeInteger(check.id) || check.id < 1)) {
              throw Error("VeriSentry refuses incomplete or foreign-App check inventory");
            }
            // An independently authenticated first-attempt manual release
            // decision is durable for this exact PR/base/head/test-merge SHA.
            // PR title/body edits must not erase its monotonic decision receipt,
            // or a later revoke could be replayed by an older manual job.
            // Candidate-owned Actions cannot forge these checks: the API query
            // filters by this dedicated GitHub App ID.
            const manualPattern = /^actor=(0monish|amishabenramani) decision=(approve|revoke) pr=([1-9][0-9]*) base=([a-f0-9]{40}) head=([a-f0-9]{40}) merge=([a-f0-9]{40}) maintenance-run=([1-9][0-9]*)$/;
            const marked = checks.filter(check =>
              typeof check.output?.summary === "string" &&
              check.output.summary.includes("maintenance-run="));
            let invalidManual = false;
            if (marked.length) {
              const summary = marked[0].output.summary;
              const match = manualPattern.exec(summary);
              const expectedConclusion = match?.[2] === "approve" ? "success" : "failure";
              const matchesCurrent = match && Number(match[3]) === event.number &&
                match[4] === event.base.sha && match[5] === event.head.sha &&
                match[6] === pr.merge_commit_sha;
              invalidManual = !matchesCurrent || marked.length !== checks.length ||
                checks.some(check => check.output?.summary !== summary ||
                  check.status !== "completed" || check.conclusion !== expectedConclusion);
              if (!invalidManual) {
                // A manual release may only have been issued for a protected
                // change denied by automatic provenance. It never converts
                // failed immutable evidence into an automatic PASS.
                core.info("VeriSentry preserves an audited exact-SHA manual " +
                  match[2] + " decision from run " + match[7]);
                if (!verified) throw new Error("Automatic admission denied; independent manual decision retained");
                return;
              }
            }
            const finalVerified = verified && !invalidManual;
            const result = {
              status: "completed", conclusion: finalVerified ? "success" : "failure",
              details_url: details,
              output: {
                title: finalVerified ? "Trusted CI admission passed" : "Trusted CI admission rejected",
                summary: invalidManual
                  ? "Inconsistent or cross-PR manual release receipt; refusing App PASS."
                  : finalVerified
                    ? "Protected-base CI authority inspected for the current PR head, base and test merge."
                    : "Protected-base verification failed or lacked matching head/base evidence for this PR merge.",
              },
            };
            if (!checks.length) {
              await github.rest.checks.create({
                owner, repo, name: "KELD VeriSentry", head_sha: pr.merge_commit_sha,
                ...result,
              });
            } else {
              for (const check of checks) {
                await github.rest.checks.update({
                  owner, repo, check_run_id: check.id, ...result,
                });
              }
            }
            if (!finalVerified) throw new Error("VeriSentry published a blocking failure");
