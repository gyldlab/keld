# KEL-169: base-branch-owned CI admission, intentionally CodeQL-free.
# The verification job never executes PR code or accesses secrets. The separate
# publisher job uses a restricted environment-scoped GitHub App credential; no
# job checks out PR code, writes a cache, or runs a shell step.
name: CI provenance

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    name: CI provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified_head_sha: ${{ steps.verify.outputs.verified_head_sha }}
      verified_base_sha: ${{ steps.verify.outputs.verified_base_sha }}
      verified_base_is_ancestor: ${{ steps.verify.outputs.verified_base_is_ancestor }}
    steps:
      - name: Refuse unreviewed CI authority changes
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0, pinned
        with:
          script: |
            // This script is sourced from protected default-branch bytes by
            // pull_request_target. PR contents are read only as untrusted API
            // metadata; never interpolate filenames into shell or run PR code.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const event = context.payload.pull_request;
            const isSha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
            if (owner !== "gyldlab" || repo !== "keld" || !event) {
              throw new Error("CI provenance requires the expected base repository and PR event");
            }
            if (!Number.isSafeInteger(event.number) || event.number < 1) {
              throw new Error("CI provenance requires a valid pull request number");
            }
            const fetchPR = async () =>
              (await github.rest.pulls.get({ owner, repo, pull_number: event.number })).data;
            const verifyPR = (pr) => {
              if (!pr || pr.state !== "open" || pr.number !== event.number) {
                throw new Error("CI provenance refuses absent, closed or changed pull requests");
              }
              if (pr.base?.ref !== "main" || pr.base?.repo?.full_name !== "gyldlab/keld") {
                throw new Error("CI provenance accepts only gyldlab/keld main as the base");
              }
              if (pr.head?.sha !== event.head?.sha || pr.base?.sha !== event.base?.sha) {
                throw new Error("CI provenance refuses stale pull-request head/base event data");
              }
              // GitHub's immutable Compare Commits API exposes at most 300
              // changed files on its first page. Refuse the boundary itself
              // because 300 entries cannot prove that more were not truncated.
              if (!Number.isSafeInteger(pr.changed_files) ||
                  pr.changed_files < 0 || pr.changed_files >= 300) {
                throw new Error("CI provenance cannot safely enumerate all changed files");
              }
              return pr;
            };
            const before = verifyPR(await fetchPR());
            // PR-number listFiles is mutable, allowing an A -> B -> A ABA
            // force-push to hide a protected file in the middle of enumeration.
            // Compare the event's immutable base and head commit SHAs instead.
            // Only the first page of the comparison includes a file list.
            const comparison = (await github.rest.repos.compareCommits({
              owner, repo, base: before.base.sha, head: before.head.sha,
              page: 1, per_page: 100,
            })).data;
            const files = comparison?.files;
            if (comparison?.base_commit?.sha !== before.base.sha) {
              throw new Error("CI provenance refuses a comparison for the wrong immutable base");
            }
            if (!Array.isArray(files) || files.length !== before.changed_files ||
                files.length >= 300) {
              throw new Error("CI provenance refuses an incomplete or truncated file list");
            }
            // The PR itself can mint the old 'CI required' status. Until a
            // trusted job is made required, it must not be allowed to change
            // workflow definitions, the router, or executable CI policy.
            const protectedPath = (path) => {
              if (typeof path !== "string" || !path || path.includes("\\") ||
                  path.includes("\u0000")) {
                throw new Error("CI provenance refuses malformed Git paths");
              }
              const p = path.toLowerCase();
              const basename = p.slice(p.lastIndexOf("/") + 1);
              // Bun's native formatter can hide tracked sources via ignores
              // or change accepted formatting through per-directory configs.
              // These inputs are CI authority even when no workflow changes.
              const formatterPolicy =
                basename === ".gitignore" ||
                basename === ".prettierignore" ||
                basename === ".editorconfig" ||
                basename === ".prettierrc" ||
                basename.startsWith(".prettierrc.") ||
                basename.startsWith("prettier.config.") ||
                basename === ".oxfmtrc" ||
                basename.startsWith(".oxfmtrc.") ||
                basename.startsWith("oxfmt.config.") ||
                basename === "biome.json" ||
                basename === "biome.jsonc" ||
                basename === "package.yaml" ||
                basename === "package.yml";
              // Strict first rollout: scripts and config files executed by
              // CI are also authority, not merely the workflow YAML itself.
              // Require a separate trusted-base review for their changes.
              // Root workspace metadata and formatter/test configs can also
              // suppress required test discovery without changing ci.yml.
              return formatterPolicy ||
                p === "cargo.toml" || p.endsWith("/cargo.toml") ||
                p === "package.json" || p.endsWith("/package.json") ||
                p === "packages/@keld/kipc/scripts/echo-codegen.ts" ||
                // Directly executed native CI validation/harness sources. A
                // candidate must not replace a smoke/registry gate with echo 0.
                // Protect direct and transitive WebView test harness inputs;
                // e.g. linux_gui_smoke.sh -> linux_media_guard.sh ->
                // linux_media_checkout.sh, plus C interposers and Windows ps1.
                (p.startsWith("crates/keld-wv/tests/") &&
                  [".sh", ".ps1", ".c", ".bat", ".cmd"].some((ext) => p.endsWith(ext))) ||
                p === "crates/keld-wv/examples/linux_media_guard.rs" ||
                p === "docs/audits/verify.py" ||
                p === "docs/audits/test_verify.py" ||
                p === "bunfig.toml" || p.endsWith("/bunfig.toml") ||
                p === "rustfmt.toml" || p.endsWith("/rustfmt.toml") ||
                p === ".rustfmt.toml" || p.endsWith("/.rustfmt.toml") ||
                p === "tsconfig.json" || p.endsWith("/tsconfig.json") ||
                p.startsWith(".github/") ||
                p === ".ci-reader-proofs" || p.startsWith(".ci-reader-proofs/") ||
                p.startsWith(".cargo/") ||
                p.startsWith(".config/") ||
                p.startsWith("tools/") ||
                p === "justfile" ||
                p === "rust-toolchain.toml" ||
                p === "deny.toml" ||
                p.endsWith("/deny.toml") ||
                p.startsWith(".gitleaks") ||
                p === "clippy.toml" || p.endsWith("/clippy.toml") ||
                p === ".clippy.toml" || p.endsWith("/.clippy.toml");
            };
            // __TRUSTED_COMMIT_HISTORY_BEGIN__
            // Net diffs cannot see a protected change followed by a revert.
            // Scan every ahead commit from the immutable Compare Commits list.
            // Bound API work and refuse missing/truncated pages before PASS.
            const verifyHistory = async (comparison, expectedBase, expectedHead) => {
              if (comparison?.base_commit?.sha !== expectedBase ||
                  !isSha(comparison?.merge_base_commit?.sha) ||
                  !Number.isSafeInteger(comparison?.total_commits) ||
                  comparison.total_commits < 1 || comparison.total_commits > 30 ||
                  !Array.isArray(comparison.commits) ||
                  comparison.commits.length !== comparison.total_commits ||
                  comparison.commits.at(-1)?.sha !== expectedHead) {
                throw Error('CI provenance refuses incomplete or excessive commit history');
              }
              const visited = new Set();
              for (const commit of comparison.commits) {
                if (!isSha(commit?.sha) || visited.has(commit.sha))
                  throw Error('CI provenance refuses duplicated or malformed commit history');
                visited.add(commit.sha);
                const paths = new Set();
                let complete = false;
                // GitHub paginates commit file lists; 300 or more changed
                // files in one commit are deliberately outside this policy.
                for (let page = 1; page <= 3; page++) {
                  const detail = (await github.rest.repos.getCommit({
                    owner, repo, ref: commit.sha, page, per_page: 100,
                  })).data;
                  if (detail?.sha !== commit.sha || !Array.isArray(detail.files) ||
                      detail.files.length > 100 || !Array.isArray(detail.parents) ||
                      detail.parents.length < 1 || detail.parents.length > 2 ||
                      detail.parents.some(parent => !isSha(parent?.sha))) {
                    throw Error('CI provenance refuses malformed commit file evidence');
                  }
                  for (const file of detail.files) {
                    if (!file ||
                        !['added','removed','modified','renamed','changed','copied'].includes(file.status) ||
                        (file.status === 'renamed' && !file.previous_filename)) {
                      throw Error('CI provenance refuses unknown commit file or rename');
                    }
                    // Validation is shared with the net-diff policy, including
                    // old rename paths and malformed case/encoding.
                    const touched = protectedPath(file.filename) ||
                      (file.previous_filename && protectedPath(file.previous_filename));
                    if (paths.has(file.filename))
                      throw Error('CI provenance refuses duplicate paginated commit files');
                    paths.add(file.filename);
                    if (touched)
                      throw Error('CI provenance: protected authority touched in commit history');
                  }
                  if (detail.files.length < 100) {
                    complete = true;
                    break;
                  }
                }
                if (!complete)
                  throw Error('CI provenance refuses truncated commit file history (>=300 files)');
              }
              return comparison.merge_base_commit.sha === expectedBase;
            };
            // __TRUSTED_COMMIT_HISTORY_END__
            const protectedChanges = [];
            for (const file of files) {
              if (!file || !["added", "removed", "modified", "renamed", "changed", "copied"].includes(file.status)) {
                throw new Error("CI provenance refuses unknown changed-file status");
              }
              if (file.status === "renamed" && !file.previous_filename) {
                throw new Error("CI provenance refuses a rename with missing source path");
              }
              if (protectedPath(file.filename) ||
                  (file.previous_filename && protectedPath(file.previous_filename))) {
                protectedChanges.push(file.filename);
              }
            }
            // Reject every protected authority change until a separate,
            // revocation-aware maintainer approval protocol is live. GitHub
            // review dismissal does not trigger this pull_request_target job,
            // so caching a past APPROVED review would permit stale PASS.
            if (protectedChanges.length) {
              throw new Error("CI provenance: changes to protected CI authority require a separately reviewed trusted-base policy update: " +
                protectedChanges.slice(0, 12).join(", "));
            }
            const baseIsAncestor = await verifyHistory(comparison, before.base.sha, before.head.sha);
            verifyPR(await fetchPR()); // A new head must trigger its own event.
            core.info("CI provenance: unchanged workflow/router/CI authority and commit history; " +
              files.length + " PR files inspected at " + before.head.sha);
            core.setOutput("verified_head_sha", before.head.sha);
            core.setOutput("verified_base_sha", before.base.sha);
            core.setOutput("verified_base_is_ancestor", String(baseIsAncestor));

  publish:
    name: KELD VeriSentry publisher
    # A failure must publish FAIL on the exact current PR head, not a skipped
    # GitHub Actions job. The required check itself is App-authenticated.
    needs: provenance
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: verisentry-publisher
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Mint repository-scoped VeriSentry installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # pinned v3, 2026-10-31
        with:
          app-id: "5550363"
          private-key: ${{ secrets.VERISENTRY_APP_PRIVATE_KEY }}
          owner: gyldlab
          repositories: keld
          # Narrow the installation token; the App installation has more access.
          permission-checks: write
          permission-pull-requests: read
          permission-contents: read # verify protected main has not advanced before App writes
      - name: Publish fail-closed dual-target VeriSentry checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned v9.0.0
        env:
          VERISENTRY_ADMISSION_RESULT: ${{ needs.provenance.result }}
          VERISENTRY_VERIFIED_HEAD: ${{ needs.provenance.outputs.verified_head_sha }}
          VERISENTRY_VERIFIED_BASE: ${{ needs.provenance.outputs.verified_base_sha }}
          VERISENTRY_VERIFIED_ANCESTRY: ${{ needs.provenance.outputs.verified_base_is_ancestor }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // Runs only from protected default-branch bytes. Never execute
            // untrusted code or interpolate PR data into a shell command.
            const { owner, repo } = context.repo;
            const event = context.payload.pull_request;
            const isSha = (value) => typeof value === "string" && /^[a-f0-9]{40}$/.test(value);
            // A late pull_request_target rerun must never use stale protected
            // workflow bytes to create an App receipt under a newer policy.
            if (process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                !process.env.GITHUB_WORKFLOW_REF?.endsWith('/.github/workflows/ci-provenance.yml@refs/heads/main') ||
                context.sha !== process.env.GITHUB_SHA) {
              throw Error('VeriSentry refuses stale/untrusted workflow source');
            }
            if (owner !== "gyldlab" || repo !== "keld" || !event ||
                !Number.isSafeInteger(event.number) || event.number < 1 ||
                !isSha(event.head?.sha) || !isSha(event.base?.sha)) {
              throw new Error("VeriSentry refuses an untrusted PR event");
            }
            if (event.base.sha !== context.sha)
              throw Error('VeriSentry requires the event base to equal protected workflow SHA');
            const currentMain = async () =>
              (await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data?.object?.sha;
            if (await currentMain() !== context.sha)
              throw Error('VeriSentry refuses a stale protected-main source');
            // HEAD App SUCCESS is only safe with GitHub-enforced strict
            // freshness, which invalidates prior HEAD checks on base advance.
            // The native App ruleset is currently loose; never infer strict
            // from a user-controlled PR or workflow environment variable.
            const strictNativeAppGate = async () => {
              const rule = (await github.rest.repos.getRepoRuleset({
                owner,repo,ruleset_id:26261486,
              })).data;
              const requirements = rule?.rules?.filter(r => r.type === 'required_status_checks');
              return rule?.enforcement === 'active' && requirements?.length === 1 &&
                requirements[0]?.parameters?.strict_required_status_checks_policy === true &&
                requirements[0]?.parameters?.required_status_checks?.some(c =>
                  c.context === 'KELD VeriSentry' && c.integration_id === 5550363) &&
                requirements[0].parameters.required_status_checks.length === 1;
            };
            // GitHub computes the test-merge SHA asynchronously. Retry only
            // bounded GitHub API reads, never execute or fetch PR code.
            // Reject a moved/closed PR on EVERY read (including after delay).
            let pr;
            let ready = false;
            for (let attempt = 0; attempt < 6; attempt++) {
              pr = (await github.rest.pulls.get({
                owner, repo, pull_number: event.number,
              })).data;
              if (pr?.state !== "open" || pr?.number !== event.number ||
                  pr.base?.ref !== "main" ||
                  pr.base?.repo?.full_name !== "gyldlab/keld" ||
                  pr.head?.sha !== event.head.sha || pr.base?.sha !== event.base.sha) {
                throw new Error("VeriSentry refuses stale or changed PR state");
              }
              if (pr.mergeable === false) {
                throw new Error("VeriSentry refuses an unmergeable PR");
              }
              // Checks on the synthetic merge commit cannot be replayed by a
              // different PR that uses the same source head SHA.
              if (pr.mergeable === true && isSha(pr.merge_commit_sha)) {
                ready = true;
                break;
              }
              if (attempt < 5) {
                await new Promise((resolve) => setTimeout(resolve, 500 * (attempt + 1)));
              }
            }
            if (!ready) {
              throw new Error("VeriSentry requires a current test-merge commit");
            }
            const verified = process.env.VERISENTRY_ADMISSION_RESULT === "success" &&
              process.env.VERISENTRY_VERIFIED_HEAD === event.head.sha &&
              process.env.VERISENTRY_VERIFIED_BASE === event.base.sha;
            // SECURITY REVIEW BLOCKER (draft only): a HEAD check is keyed by
            // commit SHA. Today's unique-open-PR census cannot prevent a
            // SECOND PR opened later from inheriting the signed HEAD PASS.
            // Native strict required-check freshness prevents base-advance
            // reuse, but does not bind a prior PASS to the original PR ID.
            // Do not deploy HEAD publication; use exact staged SHA merge queue.
            // The native test-merge receipt is PR-specific.
            const open = await github.paginate(github.rest.pulls.list, {
              owner,repo,state:'open',base:'main',per_page:100,
            });
            if (!Array.isArray(open) || open.length > 20000 ||
                new Set(open.map(p => p.number)).size !== open.length ||
                open.some(p => !Number.isSafeInteger(p.number) || p.number < 1 ||
                  !isSha(p.head?.sha) || !isSha(p.base?.sha))) {
              throw Error('VeriSentry refuses malformed or incomplete PR identity census');
            }
            const collisions = open.filter(p =>
              p.head.sha === event.head.sha ||
              (isSha(p.merge_commit_sha) && p.merge_commit_sha === pr.merge_commit_sha));
            const uniquelyBound = collisions.length === 1 &&
              collisions[0].number === event.number;
            if (!uniquelyBound)
              throw Error('VeriSentry refuses shared HEAD or synthetic-merge identity');
            // Recheck both the PR and main immediately before signed writes.
            const current = (await github.rest.pulls.get({owner,repo,pull_number:event.number})).data;
            if (current?.state !== 'open' || current.number !== event.number ||
                current.head?.sha !== event.head.sha || current.base?.sha !== event.base.sha ||
                current.merge_commit_sha !== pr.merge_commit_sha ||
                current.mergeable === false || await currentMain() !== context.sha) {
              throw Error('VeriSentry refuses moved PR or main before App publication');
            }
            const details = `${process.env.GITHUB_SERVER_URL || "https://github.com"}/gyldlab/keld/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const publish = async (sha, conclusion, target) => {
              if (await currentMain() !== context.sha)
                throw Error('VeriSentry refuses main advance during signed App writes');
              const result = (await github.rest.checks.create({
                owner,repo,name:'KELD VeriSentry',head_sha:sha,
                status:'completed',conclusion,details_url:details,
                output:{
                  title: conclusion === 'success' ? 'Trusted CI admission passed' : 'Trusted CI admission rejected',
                  summary:'PR #'+event.number+' base='+event.base.sha+' head='+event.head.sha+
                    ' merge='+pr.merge_commit_sha+' target='+target+' policy='+context.sha+
                    ' trusted immutable history and protected-path admission '+conclusion,
                },
              })).data;
              if (result?.app?.id !== 5550363 || result.head_sha !== sha ||
                  result.conclusion !== conclusion)
                throw Error('VeriSentry refuses unverified App identity or check SHA');
            };
            // Preserve the synthetic test-merge check for GitHub's PR UI and
            // mergeability logic, even while native strict HEAD release is gated.
            await publish(pr.merge_commit_sha,verified ? 'success' : 'failure','test-merge');
            if (!verified) throw Error('VeriSentry published a blocking failure');
            if (process.env.VERISENTRY_VERIFIED_ANCESTRY !== 'true') {
              core.info('VeriSentry HEAD check withheld: base is not ancestor of PR HEAD');
              return;
            }
            if (!await strictNativeAppGate()) {
              core.info('VeriSentry HEAD check withheld: native App rule is not strict');
              return;
            }
            if (await currentMain() !== context.sha)
              throw Error('VeriSentry refuses main advance before HEAD App check');
            const stillCurrent = (await github.rest.pulls.get({
              owner,repo,pull_number:event.number,
            })).data;
            if (stillCurrent?.head?.sha !== event.head.sha ||
                stillCurrent?.base?.sha !== event.base.sha ||
                stillCurrent?.merge_commit_sha !== pr.merge_commit_sha ||
                stillCurrent?.state !== 'open') {
              throw Error('VeriSentry refuses changed PR before HEAD App check');
            }
            await publish(event.head.sha,'success','head');
