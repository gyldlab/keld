# Keld CI — gates promised in AGENTS.md / docs/agents/workflow.md:
#   cargo fmt --check · clippy (warnings deny) · cargo nextest · rustdoc
#   + Mermaid/docs contracts, MSRV, cargo-deny, gitleaks, and
#   CODEOWNERS/template hygiene (KEL-39).
#
# Toolchain: rust-toolchain.toml pins the local rustup channel. The
# dtolnay/rust-toolchain action still requires `with: toolchain:` (this SHA
# does not auto-read rust-toolchain.toml). Actions are pinned to full commit
# SHAs (tag in the trailing comment). Dependabot can bump the github-actions
# ecosystem weekly.
#
# gitleaks: the GitHub Action requires a GITLEAKS_LICENSE on organization
# repos. This job installs the OSS CLI and verifies the archive checksum.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: change router
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      docs: ${{ steps.classify.outputs.docs }}
      hygiene: ${{ steps.classify.outputs.hygiene }}
      gui: ${{ steps.classify.outputs.gui }}
      msrv: ${{ steps.classify.outputs.msrv }}
      deny: ${{ steps.classify.outputs.deny }}
      ts: ${{ steps.classify.outputs.ts }}
      webkitgtk: ${{ steps.classify.outputs.webkitgtk }}
      packages: ${{ steps.classify.outputs.packages }}
      nongtk_packages: ${{ steps.classify.outputs.nongtk_packages }}
      ubuntu_packages: ${{ steps.classify.outputs.ubuntu_packages }}
      ts_packages: ${{ steps.classify.outputs.ts_packages }}
    steps:
      # Full history gives the router both PR and push comparison commits. The
      # router falls back to all lanes when either commit is unavailable.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
      - name: Router contract tests
        run: tools/ci_changes_test.sh
      - name: Classify changed-path ownership
        id: classify
        env:
          KELD_CI_EVENT_NAME: ${{ github.event_name }}
          KELD_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          KELD_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KELD_CI_BEFORE_SHA: ${{ github.event.before || '' }}
        run: tools/ci_changes.sh github

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: changes
    # Job-level `if` cannot use `matrix` (GitHub evaluates it before expansion).
    # Ubuntu apt and GTK package selection stay on steps, which do have `matrix`.
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install WebKitGTK build deps (KEL-28, see keld-wv/Cargo.toml)
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.webkitgtk == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev pkg-config build-essential
      # Exact pin (KEL-77): Bun 1.4.0 fixed kill-after-exit. Do not float `latest`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: clippy (warnings deny)
        shell: bash
        env:
          KELD_CI_PACKAGES: ${{ needs.changes.outputs.packages }}
          KELD_CI_UBUNTU_PACKAGES: ${{ needs.changes.outputs.ubuntu_packages }}
        run: |
          packages="$KELD_CI_PACKAGES"
          if [ "${{ matrix.os }}" = ubuntu-latest ]; then
            packages="$KELD_CI_UBUNTU_PACKAGES"
          fi
          for package in $packages; do
            cargo clippy -p "$package" --all-targets -- -D warnings
          done
      # v2.9.4 tar'd nextest into `%CARGO_HOME%\bin` using a Git-bash
      # `C:\...` path (`C\:\\Users\...`: Cannot open). Create the dir for
      # all OSes (pwsh is on ubuntu/macos/windows runners) and pin v2.85+
      # which extracts into `dirname $(type -P cargo)` on Windows.
      - name: Ensure cargo bin dir exists
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          New-Item -ItemType Directory -Force -Path (Join-Path $cargoHome 'bin') | Out-Null
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: nextest
      - name: test
        shell: bash
        env:
          KELD_CI_PACKAGES: ${{ needs.changes.outputs.packages }}
          KELD_CI_UBUNTU_PACKAGES: ${{ needs.changes.outputs.ubuntu_packages }}
        run: |
          packages="$KELD_CI_PACKAGES"
          if [ "${{ matrix.os }}" = ubuntu-latest ]; then
            packages="$KELD_CI_UBUNTU_PACKAGES"
          fi
          for package in $packages; do
            cargo nextest run -p "$package" --profile ci --no-tests=pass
          done
      - name: rustdoc (warnings deny)
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
          KELD_CI_UBUNTU_PACKAGES: ${{ needs.changes.outputs.ubuntu_packages }}
        run: |
          for package in $KELD_CI_UBUNTU_PACKAGES; do
            cargo doc -p "$package" --no-deps
          done

  bun-test:
    name: bun test (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # This lane owns one contract: the Bun suites under `packages/` pass. Its
    # only inputs are those package trees, so a Rust-only diff skips it and a
    # TypeScript diff runs it (tools/ci_changes.sh, `ts` output). Job-level
    # `if` may reference needs/github/vars/inputs only — GitHub evaluates it
    # before matrix expansion, so `matrix` here would invalidate the workflow.
    if: needs.changes.outputs.ts == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Exact pin (KEL-77): Bun 1.4.0 fixed kill-after-exit. Do not float `latest`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      # No `bun install` step: every `packages/` manifest declares zero
      # dependencies today, so there is nothing to resolve. A package that adds
      # one must land a committed lockfile and `bun install --frozen-lockfile`
      # here, not an unpinned resolve at job time.
      - name: bun test
        shell: bash
        env:
          KELD_CI_TS_PACKAGES: ${{ needs.changes.outputs.ts_packages }}
        run: |
          # An empty list would make this loop a silent success — the
          # skipped-green outcome the router already refuses to emit. The
          # router owns which suites run; this only rejects an empty handoff.
          if [ -z "$KELD_CI_TS_PACKAGES" ]; then
            echo "::error::TypeScript lane ran with no Bun suite; check the router's ts_packages output"
            exit 1
          fi
          for package in $KELD_CI_TS_PACKAGES; do
            (cd "$package" && bun test)
          done

  linux-gui-smoke:
    name: Linux GUI smoke test (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install WebKitGTK build deps + Xvfb + xdotool (KEL-28)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev pkg-config build-essential xvfb xdotool
      - name: Build keld-host
        run: cargo build -p keld-host
      # KEL-28's own DoD promised "a smoke test exists that CI can run
      # (headless/virtual display where needed)" but this job never existed
      # until now — closing a disclosed gap, not a new requirement.
      # No GPU/Wayland on this runner, so the GPU-safe-mode probe
      # (webkitgtk::probe_gpu_stack) reports Normal and is a no-op here;
      # this job proves window creation, not the safe-mode branch.
      - name: Xvfb GUI smoke test — real titled window via xdotool
        run: |
          set -uo pipefail
          xvfb_pid=""
          hello_pid=""
          # A bare `trap '... || true' EXIT` clobbers $? with the trap's own
          # last command status, so a script that hit `exit 1` would report
          # success to the CI step. Capture the real exit code first, run
          # cleanup, then re-exit with the captured code explicitly.
          cleanup() {
            ec=$?
            [ -n "$hello_pid" ] && kill "$hello_pid" 2>/dev/null || true
            [ -n "$xvfb_pid" ] && kill "$xvfb_pid" 2>/dev/null || true
            exit "$ec"
          }
          trap cleanup EXIT

          Xvfb :99 -screen 0 1024x768x24 &
          xvfb_pid=$!

          for _ in $(seq 1 50); do
            [ -e /tmp/.X11-unix/X99 ] && break
            sleep 0.2
          done
          if [ ! -e /tmp/.X11-unix/X99 ]; then
            echo "::error::Xvfb never created its X11 socket"
            exit 1
          fi
          export DISPLAY=:99

          ./target/debug/keld-host --hello --title CI-Linux-Smoke &
          hello_pid=$!

          found=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$hello_pid" 2>/dev/null; then
              echo "::error::keld-host --hello exited before a window was found"
              break
            fi
            if xdotool search --name "CI-Linux-Smoke" >/dev/null 2>&1; then
              found=1
              break
            fi
            sleep 0.5
          done

          if [ "$found" -ne 1 ]; then
            echo "::error::keld-host --hello never produced a titled window under Xvfb"
            exit 1
          fi
          echo "Linux hello window confirmed via xdotool under Xvfb"

  msrv:
    name: MSRV
    runs-on: macos-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.msrv == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Read MSRV from workspace metadata
        id: msrv
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')"
          echo "msrv=${msrv}" >> "$GITHUB_OUTPUT"
      - name: cargo check on MSRV toolchain
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.msrv }}" --profile minimal
          for package in ${{ needs.changes.outputs.packages }}; do
            cargo +${{ steps.msrv.outputs.msrv }} check -p "$package" --all-targets
          done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  hygiene:
    name: CODEOWNERS + templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.hygiene == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Atomic problem-solving protocol contract
        run: |
          mkdir -p target/atomic-protocol
          rustc --edition=2024 -D warnings --test tools/atomic_protocol.rs -o target/atomic-protocol/atomic-protocol-test
          target/atomic-protocol/atomic-protocol-test
          rustc --edition=2024 -D warnings tools/atomic_protocol.rs -o target/atomic-protocol/atomic-protocol
          target/atomic-protocol/atomic-protocol check .
      - name: Contract tests
        if: needs.changes.outputs.hygiene == 'true'
        run: |
          mkdir -p target/ci-hygiene
          rustc --edition=2024 -D warnings --test tools/ci_hygiene.rs -o target/ci-hygiene/ci-hygiene-test
          target/ci-hygiene/ci-hygiene-test
      - name: Check this checkout
        if: needs.changes.outputs.hygiene == 'true'
        run: |
          rustc --edition=2024 -D warnings tools/ci_hygiene.rs -o target/ci-hygiene/ci-hygiene
          target/ci-hygiene/ci-hygiene check .
      - name: llms-docs check
        if: needs.changes.outputs.docs == 'true'
        run: |
          mkdir -p target/llms-docs
          rustc --edition=2024 -D warnings tools/llms_docs.rs -o target/llms-docs/llms-docs
          target/llms-docs/llms-docs check .
      - name: Mermaid docs contract tests and check
        if: needs.changes.outputs.docs == 'true'
        run: |
          mkdir -p target/mermaid-docs
          rustc --edition=2024 -D warnings --test tools/mermaid_docs.rs -o target/mermaid-docs/mermaid-docs-test
          target/mermaid-docs/mermaid-docs-test
          rustc --edition=2024 -D warnings tools/mermaid_docs.rs -o target/mermaid-docs/mermaid-docs
          target/mermaid-docs/mermaid-docs check .
      - name: Render Mermaid docs in pinned isolated container
        if: needs.changes.outputs.docs == 'true'
        run: tools/mermaid_render_check.sh

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - changes
      - fmt
      - check
      - bun-test
      - linux-gui-smoke
      - msrv
      - deny
      - secrets
      - hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify required CI results
        env:
          KELD_RESULT_CHANGES: ${{ needs.changes.result }}
          KELD_RESULT_FMT: ${{ needs.fmt.result }}
          KELD_RESULT_CHECK: ${{ needs.check.result }}
          KELD_RESULT_BUN: ${{ needs['bun-test'].result }}
          KELD_RESULT_GUI: ${{ needs['linux-gui-smoke'].result }}
          KELD_RESULT_MSRV: ${{ needs.msrv.result }}
          KELD_RESULT_DENY: ${{ needs.deny.result }}
          KELD_RESULT_SECRETS: ${{ needs.secrets.result }}
          KELD_RESULT_HYGIENE: ${{ needs.hygiene.result }}
          KELD_ROUTE_RUST: ${{ needs.changes.outputs.rust }}
          KELD_ROUTE_TS: ${{ needs.changes.outputs.ts }}
          KELD_ROUTE_GUI: ${{ needs.changes.outputs.gui }}
          KELD_ROUTE_MSRV: ${{ needs.changes.outputs.msrv }}
          KELD_ROUTE_DENY: ${{ needs.changes.outputs.deny }}
          KELD_ROUTE_HYGIENE: ${{ needs.changes.outputs.hygiene }}
          KELD_ROUTE_DOCS: ${{ needs.changes.outputs.docs }}
        run: |
          tools/ci_required.sh test
          tools/ci_required.sh check \
            "$KELD_RESULT_CHANGES" \
            "$KELD_RESULT_FMT" \
            "$KELD_RESULT_CHECK" \
            "$KELD_RESULT_BUN" \
            "$KELD_RESULT_GUI" \
            "$KELD_RESULT_MSRV" \
            "$KELD_RESULT_DENY" \
            "$KELD_RESULT_SECRETS" \
            "$KELD_RESULT_HYGIENE" \
            "$KELD_ROUTE_RUST" \
            "$KELD_ROUTE_TS" \
            "$KELD_ROUTE_GUI" \
            "$KELD_ROUTE_MSRV" \
            "$KELD_ROUTE_DENY" \
            "$KELD_ROUTE_HYGIENE" \
            "$KELD_ROUTE_DOCS"
