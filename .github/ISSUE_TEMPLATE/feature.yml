name: Feature
description: Propose new behavior. Larger than a bug fix needs an approved spec first.
title: "[feat] "
labels: [triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need and check existing issues and the public roadmap.
        Maintainers will establish scope and any required spec before implementation.
        No private tracker or research access is needed.
  - type: input
    id: linear
    attributes:
      label: Related issue (optional)
      description: Public issue/PR link or an existing KEL-n if known. Leave blank otherwise.
      placeholder: KEL-00
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Observable outcome, not a file list. Name who this is for.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Spec refs
      description: Architecture sections or `docs/specs/`. Write "needs spec" if none exists yet.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance (binary)
      description: Given / when / then items that can become tests. Include the verification gate (`cargo fmt --all --check`, `cargo clippy --workspace --all-targets -- -D warnings`, `cargo nextest run --workspace --profile ci`).
    validations:
      required: true
  - type: checkboxes
    id: yagni
    attributes:
      label: Existing work
      options:
        - label: I checked existing issues and the roadmap and described a concrete user need
          required: true
