name: Bug
description: Something does not match a spec, test, or documented command.
title: "[bug] "
labels: [triage]
body:
  - type: markdown
    attributes:
      value: |
        Report a defect in current documented behavior. No private tracker access is needed.
        Follow the [contribution guide](https://github.com/gyldlab/keld/blob/main/CONTRIBUTING.md) for public scope and submission.
        Do not include unfixed security vulnerabilities or secrets; use [private reporting](https://github.com/gyldlab/keld/security/advisories/new).
        Maintainers will help identify scope and the regression test.
  - type: input
    id: linear
    attributes:
      label: Related issue (optional)
      description: Public issue/PR link or an existing KEL-n if known. Leave blank otherwise.
      placeholder: KEL-00
  - type: input
    id: commit
    attributes:
      label: Keld commit
      description: Output of `git rev-parse HEAD`, or the tag or installed version you ran. State unknown if you cannot determine it.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS/architecture
      description: Operating system with version, and CPU architecture.
      placeholder: macOS 26.5, arm64
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: Spec section, error code, or command output that should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened, including the exact KELD-* code or exit status.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: Exact commands and steps. Bind port 0 / temp dirs if relevant.
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Relevant tool versions
      description: Output of `rustc --version` and `cargo --version` for Rust reports, `cargo nextest --version` for workspace tests, and `bun --revision` for Bun-dependent behavior. State not applicable when none apply.
      render: shell
    validations:
      required: true
  - type: textarea
    id: gate
    attributes:
      label: Verification gate
      description: Output of `cargo fmt --all --check`, `cargo clippy --workspace --all-targets -- -D warnings`, and `cargo nextest run --workspace --profile ci` if you ran them.
      render: shell
