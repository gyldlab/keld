[workspace]
resolver = "3"
members = [
    "crates/keld-core",
    "crates/keld-wv",
    "crates/keld-ipc",
    "crates/keld-guard",
    "crates/keld-native",
    "crates/keld-runtime",
    "crates/keld-update",
    "crates/keld-pack",
    "crates/keld-compat",
    "crates/keld-host",
    "crates/keld-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gyldlab/keld"
authors = ["GYLDLAB"]

[workspace.dependencies]
keld-core = { path = "crates/keld-core" }
keld-wv = { path = "crates/keld-wv" }
keld-ipc = { path = "crates/keld-ipc" }
keld-guard = { path = "crates/keld-guard" }
keld-native = { path = "crates/keld-native" }
keld-runtime = { path = "crates/keld-runtime" }
keld-update = { path = "crates/keld-update" }
keld-pack = { path = "crates/keld-pack" }
keld-compat = { path = "crates/keld-compat" }
keld-host = { path = "crates/keld-host" }
keld-cli = { path = "crates/keld-cli" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

# --- Dependency review (KEL-42 / AGENTS.md gate) ---
# Name: rmcp =3.1.2 (official modelcontextprotocol/rust-sdk)
# Purpose: MCP 2026-07-28 wire (server/discover, dual-version negotiation,
#   SEP-2549 cache hints, JSON Schema tool schemas) for `keld mcp serve`.
# Alternatives rejected: (a) hand-rolled JSON-RPC/stdio — own conformance across
#   five revisions; (b) TS SDK in a Bun sidecar — second runtime, breaks single
#   binary; (c) community crates — not official, no 2026-07-28 confirmed.
# Features: server + macros + transport-io (stdio) ONLY — no
#   transport-streamable-http*, no reqwest/auth. Exact pin: wire churn post-GA.
rmcp = { version = "=3.1.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
] }
# Tokio only on the MCP serve cold path (AGENTS.md: async only in cli tooling).
# No net: stdio only. `io-util`/`sync` are what rmcp's stdio transport needs.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "io-std",
    "io-util",
    "sync",
    "time",
] }
schemars = "1"
# Isolated temp dirs for CLI tests (dev-dep; workspace-pinned like other shared crates).
tempfile = "3"
# --- Dependency review (KEL-60 / AGENTS.md gate) ---
# Name: getrandom 0.4
# Purpose: CSPRNG for the kipc v2 HELLO session token. `std::random` is
#   unstable on 1.93 (rust-lang/rust#130703). `/dev/urandom` is Unix-only;
#   Windows ProcessPrng would be `unsafe` in Keld code (forbidden outside
#   keld-wv backends; keld-ipc shm once that module exists).
# Alternatives rejected: (a) getrandom 0.2 — older `getrandom()` API; 0.4 is
#   current (`fill`), MSRV 1.85 ≤ 1.93; (b) `rand` — extra surface; (c)
#   `uuid` — 16 bytes, wrong type; (d) `HashMap` `RandomState` — not a CSPRNG
#   API. License: MIT OR Apache-2.0 (deny.toml allow-list). Used only to mint
#   one token per cold host bootstrap; `keld-ipc` owns the primitive and the
#   CLI consumes it for the v0 echo session.
getrandom = "0.4"
# --- Dependency review (KEL-77 T2 / AGENTS.md gate) ---
# Name: sha2 0.10 (RustCrypto)
# Purpose: SHA-256 for the KEL-77 child-process fixture-corpus digest
#   (`artifact.sha256`) and the run's raw-observation `evidence_uri`, both
#   required as `sha256:` + 64 lowercase hex by `keld.compat.evidence/v1`.
#   Used only as a `keld-runtime` dev-dependency (test harness); no shipped
#   path hashes.
# Alternatives rejected: (a) hand-rolled SHA-256 — forbidden duplicate of a
#   primitive (KEL-77 spec §4.1); (b) `node -e` / `bun` — digest would depend
#   on the runtime under test; (c) `git hash-object` — SHA-1 blob id, wrong
#   algorithm; (d) reuse wry's *transitive* sha2 without a direct dep — Cargo
#   forbids using an undeclared crate; (e) no first-party hasher exists in
#   this workspace (`keld-update` is empty). Already in Cargo.lock at 0.10.9
#   via wry. License: MIT OR Apache-2.0 (deny.toml allow-list).
sha2 = "0.10"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
# `deny` rather than `forbid` so the sanctioned location (`keld-wv` platform backends
# today; `keld-ipc::shm` once that module exists) can opt in with an explicit,
# reviewable module-scope `#[allow(unsafe_code)]` + `// SAFETY:` proof, per AGENTS.md.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Keld crates share the `keld` prefix; repeating it in item names is deliberate.
module_name_repetitions = "allow"
# AGENTS.md: no unwrap/expect/panic!/todo! in library code paths. Tests are exempt
# via clippy.toml (`allow-*-in-tests`); sanctioned uses (keld-cli top level) carry a
# site-local `#[allow]` stating the invariant.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

# The shipped host binary: optimize for size and startup, keep panics abortive.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
