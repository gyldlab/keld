[workspace]
resolver = "3"
members = [
    "crates/keld-core",
    "crates/keld-wv",
    "crates/keld-ipc",
    "crates/keld-guard",
    "crates/keld-native",
    "crates/keld-runtime",
    "crates/keld-update",
    "crates/keld-pack",
    "crates/keld-compat",
    "crates/keld-host",
    "crates/keld-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gyldlab/keld"
authors = ["GYLDLAB"]

[workspace.dependencies]
keld-core = { path = "crates/keld-core" }
keld-wv = { path = "crates/keld-wv" }
keld-ipc = { path = "crates/keld-ipc" }
keld-guard = { path = "crates/keld-guard" }
keld-native = { path = "crates/keld-native" }
keld-runtime = { path = "crates/keld-runtime" }
keld-update = { path = "crates/keld-update" }
keld-pack = { path = "crates/keld-pack" }
keld-compat = { path = "crates/keld-compat" }
keld-host = { path = "crates/keld-host" }
keld-cli = { path = "crates/keld-cli" }

# --- Dependency review (KEL-96/T1a / AGENTS.md gate) ---
# Names: serde 1 + serde_json 1 (existing workspace pins; new direct keld-core use)
# Purpose: strict, bounded, deny-unknown-fields decoding of the private
#   schema-v1 `keld.boot.json`; duplicate keys must fail instead of taking a
#   first/last winner. Parsing is cold and occurs once before app resources.
# Alternatives rejected: (a) a handwritten JSON parser duplicates schema and
#   Unicode/number/string policy; (b) evaluating `keld.config.ts` violates the
#   frozen compiled-descriptor boundary; (c) permissive Value traversal does
#   not make duplicate-field rejection structural. No new versions enter the
#   lockfile; serde is MIT OR Apache-2.0 and serde_json is MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

# --- Dependency review (KEL-42 / AGENTS.md gate) ---
# Name: rmcp =3.1.2 (official modelcontextprotocol/rust-sdk)
# Purpose: MCP 2026-07-28 wire (server/discover, dual-version negotiation,
#   SEP-2549 cache hints, JSON Schema tool schemas) for `keld mcp serve`.
# Alternatives rejected: (a) hand-rolled JSON-RPC/stdio — own conformance across
#   five revisions; (b) TS SDK in a Bun sidecar — second runtime, breaks single
#   binary; (c) community crates — not official, no 2026-07-28 confirmed.
# Features: server + macros + transport-io (stdio) ONLY — no
#   transport-streamable-http*, no reqwest/auth. Exact pin: wire churn post-GA.
rmcp = { version = "=3.1.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
] }
# Tokio only on the MCP serve cold path (AGENTS.md: async only in cli tooling).
# No net: stdio only. `io-util`/`sync` are what rmcp's stdio transport needs.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "io-std",
    "io-util",
    "sync",
    "time",
] }
schemars = "1"
# Isolated temp dirs for CLI tests (dev-dep; workspace-pinned like other shared crates).
tempfile = "3"
# --- Dependency review (KEL-60 / AGENTS.md gate) ---
# Name: getrandom 0.4
# Purpose: CSPRNG for the kipc v2 HELLO session token. `std::random` is
#   unstable on 1.93 (rust-lang/rust#130703). `/dev/urandom` is Unix-only;
#   Windows ProcessPrng would be `unsafe` in Keld code (forbidden outside
#   keld-wv backends; keld-ipc shm once that module exists).
# Alternatives rejected: (a) getrandom 0.2 — older `getrandom()` API; 0.4 is
#   current (`fill`), MSRV 1.85 ≤ 1.93; (b) `rand` — extra surface; (c)
#   `uuid` — 16 bytes, wrong type; (d) `HashMap` `RandomState` — not a CSPRNG
#   API. License: MIT OR Apache-2.0 (deny.toml allow-list). Used only to mint
#   one token per cold host bootstrap; `keld-ipc` owns the primitive and the
#   CLI consumes it for the v0 echo session.
getrandom = "0.4"
# --- Dependency review (KEL-78/T2b / AGENTS.md gate) ---
# Name: nix =0.31.3 (nix-rust/nix)
# Purpose: safe macOS `killpg(2)` for the host-death guardian and safe
#   `openat(2)`/`O_NOFOLLOW` traversal for KEL-96's staged boot targets. The
#   workspace denies unsafe in keld-runtime/keld-core, while std exposes
#   process-group creation but no group-signal API and no component-wise
#   no-follow relative open.
# Alternatives rejected: (a) direct libc/FFI — violates `unsafe_code`; (b)
#   `/bin/kill` subprocess — external executable and a second failure domain on
#   the cleanup path; (c) PID-by-PID kill — races reuse and misses descendants;
#   (d) process group without an independent guardian — no actor survives host
#   death to signal it. Exact current crates.io release; MSRV 1.69 <= Keld 1.97.
# Default features are off; `signal` (which implies `process`) supplies group
# signaling and `fs` supplies safe descriptor-kind/CLOEXEC validation for the
# private liveness bootstrap. License: MIT (deny.toml allow-list).
nix = { version = "=0.31.3", default-features = false, features = ["fs", "signal"] }
# --- Dependency review (KEL-78/T3 / AGENTS.md gate) ---
# Name: windows-sys =0.61.2 (microsoft/windows-rs)
# Purpose: official target-only Win32 bindings for the unnamed host Job,
#   zero-capability LPAC STARTUPINFOEX attributes, AppContainer profile SID,
#   and explicit inherited-handle list required by the approved Windows T3
#   process boundary. Already present in Cargo.lock through tempfile.
# Alternatives rejected: std exposes none of these process security APIs;
#   keld-wv's crate-local `windows` projection is the wrong owner and adds
#   broader runtime surface; winapi duplicates an older binding; the 2025
#   Experimental_CreateProcessInSandbox API is explicitly experimental and
#   does not implement the frozen manual LPAC contract. License MIT OR
#   Apache-2.0; MSRV 1.71 <= workspace 1.97. Unsafe is isolated to reviewed
#   Windows platform modules with exact handle/pointer lifetime proofs.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
# --- Dependency review (KEL-77 T2 / AGENTS.md gate) ---
# Name: sha2 0.10 (RustCrypto)
# Purpose: SHA-256 for KEL-77 test artifacts and KEL-96's cold `keld-cli`
#   boot compiler: it proves the new-inode host copy and emits the exact
#   permissions-fixture digest. The no-flag host deliberately does not hash or
#   parse policy bytes before KEL-102/T2.
# Alternatives rejected: (a) hand-rolled SHA-256 — forbidden duplicate of a
#   primitive (KEL-77 spec §4.1); (b) `node -e` / `bun` — digest would depend
#   on the runtime under test; (c) `git hash-object` — SHA-1 blob id, wrong
#   algorithm; (d) reuse wry's *transitive* sha2 without a direct dep — Cargo
#   forbids using an undeclared crate; (e) shelling out to `shasum` would add a
#   platform process and TOCTOU reopen to the staging transaction. No
#   first-party hasher exists in this workspace (`keld-update` is empty).
#   Already in Cargo.lock at 0.10.9
#   via wry. License: MIT OR Apache-2.0 (deny.toml allow-list).
sha2 = "0.10"
# --- Dependency review (KEL-96/T4 / AGENTS.md gate) ---
# Name: windows-permissions 0.2.4 (danieldulaney/windows-permissions-rs)
# Purpose: safe target-only TokenUser SID plus protected DACL creation/readback
#   for the Windows owner-private no-flag dev stage. windows-sys supplies the
#   canonical filesystem/handle constants, one atomic CreateDirectoryW call,
#   and stdin inheritance isolation; the stage is cold tooling and
#   independently validated before app resources.
# Alternatives rejected: (a) std exposes attributes, not DACLs or atomic
#   security attributes; (b) broader windows-rs calls add surface without
#   removing the one required FFI proof; (c) windows-acl exposes
#   raw PSID caller contracts; (d) icacls/PowerShell in production adds a
#   localized subprocess and multi-step path mutation; (e) a new platform
#   crate or keld-wv helper creates the wrong policy owner. Version 0.2.4 is
#   the current crates.io release/tag, MIT, with no declared MSRV. Upstream's
#   last release commit is old (2021), so human dependency/security review is
#   mandatory and this pin is intentionally exact.
windows-permissions = "=0.2.4"
# Already locked through the workspace Windows stack; direct target-only use
# supplies canonical handle/filesystem constants, stdin inheritance isolation,
# and CreateDirectoryW + SECURITY_ATTRIBUTES for atomic DACL creation.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
# `deny` rather than `forbid` so the sanctioned location (`keld-wv` platform backends
# today; `keld-ipc::shm` once that module exists) can opt in with an explicit,
# reviewable module-scope `#[allow(unsafe_code)]` + `// SAFETY:` proof, per AGENTS.md.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Keld crates share the `keld` prefix; repeating it in item names is deliberate.
module_name_repetitions = "allow"
# AGENTS.md: no unwrap/expect/panic!/todo! in library code paths. Tests are exempt
# via clippy.toml (`allow-*-in-tests`); sanctioned uses (keld-cli top level) carry a
# site-local `#[allow]` stating the invariant.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

# The shipped host binary: optimize for size and startup, keep panics abortive.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
